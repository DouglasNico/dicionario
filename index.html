<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Dicionário Inglês–Português para celular com pronúncia, flashcards, quiz e uso offline.">
  <meta name="theme-color" content="#f6f7f9" id="meta-theme-color">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dicionário EN–PT">
  <meta name="referrer" content="no-referrer">
  <title>Dicionário Inglês–Português</title>
  <link rel="preconnect" href="https://clients5.google.com" crossorigin>
  <link rel="preconnect" href="https://translate.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://translate.google.com" crossorigin>
  <link rel="preconnect" href="https://api.dictionaryapi.dev" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
  <style>
    /* Variáveis de tema claro (padrão editorial limpo) */
    :root {
      color-scheme: light;
      --cor-fundo: #f6f7f9;
      --cor-superficie: #ffffff;
      --cor-superficie-alt: #f1f5f9;
      --cor-nav-fundo: rgba(255, 255, 255, 0.92);
      --cor-texto: #0f172a;
      --cor-texto-sec: #64748b;
      --cor-borda: #e2e8f0;
      --cor-borda-forte: #cbd5e1;
      --cor-primaria: #2563eb;
      --cor-primaria-hover: #1d4ed8;
      --cor-primaria-suave: rgba(37, 99, 235, 0.10);
      --cor-primaria-texto: #1d4ed8;
      --cor-salvo-fundo: #ecfdf5;
      --cor-salvo-texto: #047857;
      --cor-salvo-borda: #6ee7b7;
      --cor-erro-fundo: #fef2f2;
      --cor-erro-texto: #b91c1c;
      --cor-erro-borda: #fca5a5;
      --cor-alerta-fundo: #fffbeb;
      --cor-alerta-borda: #d97706;
      --cor-alerta-texto: #92400e;
      --cor-sombra: 0 1px 3px rgba(15, 23, 42, 0.05), 0 6px 20px rgba(15, 23, 42, 0.04);
      --raio: 16px;
    }

    /* Segue automaticamente o tema escuro do sistema quando não há preferência manual */
    @media (prefers-color-scheme: dark) {
      :root:not([data-tema="light"]) {
        color-scheme: dark;
        --cor-fundo: #0b1120;
        --cor-superficie: #111827;
        --cor-superficie-alt: #1e293b;
        --cor-nav-fundo: rgba(17, 24, 39, 0.92);
        --cor-texto: #f8fafc;
        --cor-texto-sec: #94a3b8;
        --cor-borda: #1f2937;
        --cor-borda-forte: #334155;
        --cor-primaria: #3b82f6;
        --cor-primaria-hover: #60a5fa;
        --cor-primaria-suave: rgba(59, 130, 246, 0.15);
        --cor-primaria-texto: #93c5fd;
        --cor-salvo-fundo: rgba(16, 185, 129, 0.14);
        --cor-salvo-texto: #6ee7b7;
        --cor-salvo-borda: rgba(16, 185, 129, 0.45);
        --cor-erro-fundo: rgba(239, 68, 68, 0.14);
        --cor-erro-texto: #fca5a5;
        --cor-erro-borda: rgba(239, 68, 68, 0.45);
        --cor-alerta-fundo: rgba(245, 158, 11, 0.12);
        --cor-alerta-borda: #f59e0b;
        --cor-alerta-texto: #fde68a;
        --cor-sombra: 0 2px 10px rgba(0, 0, 0, 0.25);
      }
    }

    /* Tema escuro ativado manualmente */
    :root[data-tema="dark"] {
      color-scheme: dark;
      --cor-fundo: #0b1120;
      --cor-superficie: #111827;
      --cor-superficie-alt: #1e293b;
      --cor-nav-fundo: rgba(17, 24, 39, 0.92);
      --cor-texto: #f8fafc;
      --cor-texto-sec: #94a3b8;
      --cor-borda: #1f2937;
      --cor-borda-forte: #334155;
      --cor-primaria: #3b82f6;
      --cor-primaria-hover: #60a5fa;
      --cor-primaria-suave: rgba(59, 130, 246, 0.15);
      --cor-primaria-texto: #93c5fd;
      --cor-salvo-fundo: rgba(16, 185, 129, 0.14);
      --cor-salvo-texto: #6ee7b7;
      --cor-salvo-borda: rgba(16, 185, 129, 0.45);
      --cor-erro-fundo: rgba(239, 68, 68, 0.14);
      --cor-erro-texto: #fca5a5;
      --cor-erro-borda: rgba(239, 68, 68, 0.45);
      --cor-alerta-fundo: rgba(245, 158, 11, 0.12);
      --cor-alerta-borda: #f59e0b;
      --cor-alerta-texto: #fde68a;
      --cor-sombra: 0 2px 10px rgba(0, 0, 0, 0.25);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      max-width: 100%;
      overflow-x: hidden;
      touch-action: manipulation;
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Margem lateral de 16px, proteção para notch/barra do iOS e espaço para abas inferiores */
    .app-container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
    }

    .icone {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }

    /* Cabeçalho compacto */
    .cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .marca {
      min-width: 0;
    }

    .marca h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .marca-sub {
      margin: 2px 0 0;
      font-size: 0.85rem;
      color: var(--cor-texto-sec);
    }

    .topo-direita {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pilula-progresso {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 6px 12px;
      border-radius: 999px;
      background-color: var(--cor-superficie);
      border: 1px solid var(--cor-borda);
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--cor-texto);
    }

    .pilula-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pilula-sep {
      width: 1px;
      height: 14px;
      background-color: var(--cor-borda-forte);
    }

    .cor-fogo {
      color: #f97316;
    }

    /* Regra geral: controles tocáveis com mínimo de 44px */
    button, .btn {
      min-height: 44px;
      min-width: 44px;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid var(--cor-borda);
      background-color: var(--cor-superficie);
      color: var(--cor-texto);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    /* Seletor customizado no estilo do aplicativo */
    .select-nativo-oculto {
      display: none !important;
    }

    .select-custom {
      position: relative;
      width: 100%;
      min-width: 0;
    }

    .select-trigger {
      width: 100%;
      min-height: 44px;
      justify-content: space-between;
      text-align: left;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-weight: 600;
      background-color: var(--cor-superficie);
      border: 1px solid var(--cor-borda);
      border-radius: 12px;
      color: var(--cor-texto);
    }

    .select-trigger[aria-expanded="true"] {
      border-color: var(--cor-primaria);
      box-shadow: 0 0 0 2px var(--cor-primaria-suave);
    }

    .select-trigger-texto {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .select-chevron {
      color: var(--cor-texto-sec);
      transition: transform 0.18s ease;
    }

    .select-trigger[aria-expanded="true"] .select-chevron {
      transform: rotate(180deg);
    }

    .select-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      min-width: 210px;
      z-index: 35;
      margin: 0;
      padding: 6px;
      list-style: none;
      background-color: var(--cor-superficie);
      border: 1px solid var(--cor-borda-forte);
      border-radius: 14px;
      box-shadow: var(--cor-sombra);
      max-height: 270px;
      overflow-y: auto;
      display: none;
    }

    .select-menu.aberto {
      display: block;
    }

    /* Em colunas estreitas à direita, alinha o menu pela direita para não vazar da tela */
    .select-custom.alinhar-direita .select-menu {
      left: auto;
      right: 0;
    }

    .select-opcao {
      width: 100%;
      min-height: 44px;
      justify-content: space-between;
      text-align: left;
      padding: 9px 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--cor-texto);
      font-size: 0.93rem;
      font-weight: 500;
    }

    .select-opcao:hover {
      background-color: var(--cor-superficie-alt);
    }

    .select-opcao.ativa {
      background-color: var(--cor-primaria-suave);
      color: var(--cor-primaria-texto);
      font-weight: 700;
    }

    /* Barras de rolagem discretas no estilo do app */
    html, .lista-sugestoes, .select-menu {
      scrollbar-width: thin;
      scrollbar-color: var(--cor-borda-forte) transparent;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: var(--cor-borda-forte);
      border-radius: 999px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--cor-primaria);
      outline-offset: 2px;
    }

    .btn-icone {
      width: 44px;
      height: 44px;
      padding: 0;
    }

    .btn-primario {
      background-color: var(--cor-primaria);
      border-color: var(--cor-primaria);
      color: #ffffff;
    }

    .btn-primario:hover:not(:disabled) {
      background-color: var(--cor-primaria-hover);
      border-color: var(--cor-primaria-hover);
    }

    .btn-suave {
      background-color: var(--cor-superficie-alt);
      border-color: transparent;
      color: var(--cor-texto);
    }

    /* Aviso offline */
    .banner-offline {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background-color: var(--cor-primaria-suave);
      color: var(--cor-primaria-texto);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .banner-offline.visivel {
      display: flex;
    }

    /* Barra de navegação: fixa no rodapé no celular, no topo em telas largas */
    .topo-safe-area {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: env(safe-area-inset-top, 0px);
      background-color: var(--cor-fundo);
      z-index: 50;
      pointer-events: none;
    }

    .abas {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 6px 10px calc(8px + env(safe-area-inset-bottom, 0px));
      background-color: var(--cor-superficie);
      border-top: 1px solid var(--cor-borda);
    }

    .aba-btn {
      position: relative;
      flex-direction: column;
      gap: 3px;
      height: 54px;
      min-height: 54px;
      padding: 6px 4px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--cor-texto-sec);
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .aba-btn.ativa {
      background-color: var(--cor-primaria-suave);
      border-color: var(--cor-primaria);
      color: var(--cor-primaria-texto);
    }

    @media (min-width: 640px) {
      .app-container {
        padding-bottom: 40px;
      }

      .abas {
        position: static;
        background-color: var(--cor-superficie);
        border: 1px solid var(--cor-borda);
        border-radius: 14px;
        padding: 4px;
        margin-bottom: 16px;
        backdrop-filter: none;
      }

      .aba-btn {
        flex-direction: row;
        gap: 6px;
        height: 44px;
        min-height: 44px;
        font-size: 0.92rem;
      }
    }

    /* Campo de busca principal */
    .busca-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .busca-caixa {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--cor-superficie);
      border: 1px solid var(--cor-borda-forte);
      border-radius: var(--raio);
      padding: 4px 6px 4px 14px;
      box-shadow: var(--cor-sombra);
    }

    .busca-caixa:focus-within {
      border-color: var(--cor-primaria);
      box-shadow: 0 0 0 2px var(--cor-primaria-suave);
    }

    .busca-icone {
      color: var(--cor-texto-sec);
      flex-shrink: 0;
    }

    .busca-input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      border: none;
      background: transparent;
      color: var(--cor-texto);
      font-family: inherit;
      font-size: 1.04rem;
      outline: none;
    }

    .busca-input:focus,
    .busca-input:focus-visible {
      outline: none;
    }

    .busca-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    .busca-input::placeholder {
      color: var(--cor-texto-sec);
    }

    .btn-limpar {
      border: none;
      background: transparent;
      color: var(--cor-texto-sec);
      padding: 0;
      display: none;
    }

    .btn-limpar.visivel {
      display: inline-flex;
    }

    .lista-sugestoes {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 30;
      margin: 0;
      padding: 6px;
      list-style: none;
      background-color: var(--cor-superficie);
      border: 1px solid var(--cor-borda-forte);
      border-radius: var(--raio);
      box-shadow: var(--cor-sombra);
      max-height: 320px;
      overflow-y: auto;
      display: none;
    }

    .lista-sugestoes.aberta {
      display: block;
    }

    .sugestao-btn {
      width: 100%;
      justify-content: space-between;
      text-align: left;
      border: none;
      background: transparent;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 500;
    }

    .sugestao-btn:hover, .sugestao-btn.selecionada {
      background-color: var(--cor-primaria-suave);
    }

    .sugestao-principal {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .sugestao-palavra {
      font-weight: 700;
      color: var(--cor-texto);
      font-size: 1.02rem;
    }

    .sugestao-trad {
      font-size: 0.9rem;
      color: var(--cor-texto-sec);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sugestao-pron {
      font-size: 0.88rem;
      color: var(--cor-primaria-texto);
      font-weight: 600;
      flex-shrink: 0;
    }

    /* Barra compacta de filtros (Tema + Nível) */
    .filtros-linha {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    /* Faixa discreta da Palavra do dia */
    .faixa-palavra-dia {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background-color: var(--cor-superficie);
      border: 1px solid var(--cor-borda);
      border-radius: 14px;
      padding: 10px 12px 10px 14px;
      margin-bottom: 14px;
    }

    .pdd-info {
      min-width: 0;
    }

    .pdd-rotulo {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--cor-primaria);
    }

    .pdd-linha {
      margin: 2px 0 0;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdd-acoes {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Card principal */
    .card-palavra, .card-painel {
      background-color: var(--cor-superficie);
      border: 1px solid var(--cor-borda);
      border-radius: var(--raio);
      padding: 18px;
      box-shadow: var(--cor-sombra);
      margin-bottom: 16px;
    }

    .card-topo {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .palavra-titulo {
      margin: 0;
      font-size: 2rem;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.025em;
      word-break: break-word;
    }

    .meta-inline {
      margin: 4px 0 0;
      font-size: 0.92rem;
      color: var(--cor-texto-sec);
      font-weight: 500;
    }

    .badge-revisar {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background-color: var(--cor-erro-fundo);
      color: var(--cor-erro-texto);
      flex-shrink: 0;
    }

    .linha-pronuncia {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      margin-bottom: 16px;
      padding: 5px 11px;
      border-radius: 8px;
      background-color: var(--cor-primaria-suave);
      color: var(--cor-primaria-texto);
      font-size: 0.98rem;
      font-weight: 600;
    }

    .acoes-palavra {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-salvar[aria-pressed="true"] {
      background-color: var(--cor-salvo-fundo);
      border-color: var(--cor-salvo-borda);
      color: var(--cor-salvo-texto);
    }

    /* Alerta discreto e claro de falso cognato */
    .alerta-falso-cognato {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background-color: var(--cor-alerta-fundo);
      border-left: 4px solid var(--cor-alerta-borda);
      color: var(--cor-alerta-texto);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .alerta-falso-cognato strong {
      display: block;
      margin-bottom: 2px;
      font-size: 0.96rem;
    }

    .secao-card {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--cor-borda);
    }

    .secao-titulo {
      margin: 0 0 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--cor-texto-sec);
      font-weight: 700;
    }

    .lista-traducoes {
      margin: 0;
      padding-left: 20px;
      font-size: 1.12rem;
      font-weight: 600;
    }

    .lista-traducoes li + li {
      margin-top: 4px;
      font-weight: 500;
      color: var(--cor-texto-sec);
    }

    .info-formas {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .info-formas em {
      font-style: normal;
      font-weight: 700;
      background-color: var(--cor-primaria-suave);
      color: var(--cor-primaria-texto);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .sugestao-vazio {
      padding: 12px;
      text-align: center;
      color: var(--cor-texto-sec);
      font-size: 0.94rem;
    }

    .exemplo-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
    }

    .exemplo-item + .exemplo-item {
      border-top: 1px solid var(--cor-borda);
    }

    .exemplo-textos {
      min-width: 0;
    }

    .exemplo-en {
      margin: 0 0 3px;
      font-size: 1.02rem;
      font-weight: 600;
    }

    .exemplo-pt {
      margin: 0;
      font-size: 0.94rem;
      color: var(--cor-texto-sec);
    }

    .aviso-voz {
      margin: 8px 0 0;
      font-size: 0.9rem;
      color: var(--cor-alerta-texto);
      background-color: var(--cor-alerta-fundo);
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }

    .aviso-voz.visivel {
      display: block;
    }

    /* Tradutor rápido */
    .tradutor-wrapper {
      margin: 10px 0;
      border-radius: 14px;
      border: 1px solid var(--cor-borda);
      background-color: var(--cor-superficie);
      overflow: hidden;
    }

    .tradutor-cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 6px;
    }

    .tradutor-lang-label {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--cor-texto-sec);
    }

    .tradutor-btn-trocar {
      min-width: 36px;
      min-height: 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--cor-primaria-texto);
    }

    .tradutor-entrada-wrapper {
      padding: 0 10px 8px 14px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .tradutor-campo {
      flex: 1;
      width: 100%;
      min-height: 44px;
      max-height: 140px;
      padding: 6px 0;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 1.04rem;
      line-height: 1.5;
      color: var(--cor-texto);
      background: transparent;
    }

    .tradutor-campo::placeholder {
      color: var(--cor-texto-sec);
      opacity: 0.65;
    }

    .tradutor-divisor {
      height: 1px;
      background-color: var(--cor-borda);
      margin: 0 14px;
    }

    .tradutor-resultado-wrapper {
      padding: 6px 10px 10px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tradutor-resultado {
      flex: 1;
      min-height: 28px;
      font-size: 1.04rem;
      line-height: 1.5;
      color: var(--cor-primaria-texto);
      font-weight: 600;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tradutor-resultado.placeholder {
      color: var(--cor-texto-sec);
      font-weight: 400;
      opacity: 0.5;
    }

    .tradutor-resultado-acoes {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .tradutor-entrada-wrapper .btn-icone,
    .tradutor-resultado-acoes .btn-icone {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: none;
      background: transparent;
      flex-shrink: 0;
    }

    .tradutor-alternativas {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 0 14px 12px;
    }

    .tradutor-alt-label {
      font-size: 0.78rem;
      color: var(--cor-texto-sec);
      font-weight: 600;
    }

    .tradutor-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 32px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--cor-borda);
      background-color: var(--cor-superficie-alt);
      color: var(--cor-texto);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tradutor-chip:hover {
      border-color: var(--cor-primaria);
      color: var(--cor-primaria-texto);
    }

    .tradutor-chip .icone {
      width: 14px;
      height: 14px;
    }

    .sugestao-online {
      border-top: 1px solid var(--cor-borda);
      background-color: var(--cor-primaria-suave);
      color: var(--cor-primaria-texto);
      font-weight: 600;
    }

    .badge-online {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      background-color: var(--cor-primaria-suave);
      color: var(--cor-primaria-texto);
      white-space: nowrap;
    }

    /* Lista do vocabulário */
    .btn-vocabulario-toggle {
      width: 100%;
      justify-content: space-between;
      padding: 12px 16px;
      margin: 4px 0 10px;
      background-color: var(--cor-superficie);
      border: 1px solid var(--cor-borda);
      border-radius: 14px;
    }

    .vocabulario-toggle-esq {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--cor-texto);
    }

    .vocabulario-toggle-dir {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--cor-texto-sec);
    }

    .vocabulario-chevron {
      transition: transform 0.18s ease;
    }

    .btn-vocabulario-toggle[aria-expanded="true"] .vocabulario-chevron {
      transform: rotate(180deg);
    }

    .grade-palavras {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    @media (min-width: 520px) {
      .grade-palavras {
        grid-template-columns: 1fr 1fr;
      }
    }

    .item-palavra-card {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 4px 0;
      border-radius: 12px;
      border: 1px solid var(--cor-borda);
      background-color: var(--cor-superficie);
      min-width: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .item-palavra-card.ativa {
      border-color: var(--cor-primaria);
      background-color: var(--cor-primaria-suave);
    }

    .item-palavra-abrir {
      flex: 1;
      min-width: 0;
      justify-content: space-between;
      text-align: left;
      padding: 8px 8px 8px 14px;
      border: none;
      background: transparent;
      border-radius: 10px;
    }

    .item-palavra-abrir:active {
      transform: none;
    }

    .btn-item-ouvir {
      flex-shrink: 0;
    }

    .item-palavra-card.ativa .btn-item-ouvir {
      background-color: var(--cor-superficie);
    }

    .item-esquerda {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 1px;
    }

    .item-titulo {
      font-size: 1.04rem;
      font-weight: 700;
      color: var(--cor-texto);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .item-sub {
      font-size: 0.9rem;
      color: var(--cor-texto-sec);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-direita {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--cor-texto-sec);
    }

    /* Flashcards e Quiz */
    .controles-estudo {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    @media (min-width: 520px) {
      .controles-estudo {
        grid-template-columns: 1fr 1fr;
      }
    }

    .campo-grupo label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--cor-texto-sec);
      margin-bottom: 4px;
    }

    .flashcard-area {
      background-color: var(--cor-superficie);
      border: 1px solid var(--cor-borda-forte);
      border-radius: var(--raio);
      padding: 18px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--cor-sombra);
      margin-bottom: 12px;
    }

    .flashcard-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.88rem;
      color: var(--cor-texto-sec);
    }

    .flashcard-frente {
      text-align: center;
      padding: 10px 0;
    }

    .flashcard-palavra {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
      word-break: break-word;
    }

    .flashcard-dica {
      font-size: 0.94rem;
      color: var(--cor-texto-sec);
      margin: 16px 0 0;
    }

    .flashcard-verso {
      text-align: left;
      border-top: 1px solid var(--cor-borda);
      padding-top: 14px;
      margin-top: 16px;
    }

    .flashcard-acoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-nao-sei {
      background-color: var(--cor-erro-fundo);
      border-color: var(--cor-erro-borda);
      color: var(--cor-erro-texto);
    }

    .btn-sei {
      background-color: var(--cor-salvo-fundo);
      border-color: var(--cor-salvo-borda);
      color: var(--cor-salvo-texto);
    }

    .btn-largura-total {
      width: 100%;
    }

    .quiz-opcoes {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .quiz-opcao-btn {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      padding: 12px 16px;
      font-size: 1.02rem;
      line-height: 1.35;
    }

    .quiz-opcao-btn.correta {
      background-color: var(--cor-salvo-fundo);
      border-color: var(--cor-salvo-borda);
      color: var(--cor-salvo-texto);
    }

    .quiz-opcao-btn.errada {
      background-color: var(--cor-erro-fundo);
      border-color: var(--cor-erro-borda);
      color: var(--cor-erro-texto);
    }

    .quiz-feedback {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quiz-feedback.acerto {
      background-color: var(--cor-salvo-fundo);
      color: var(--cor-salvo-texto);
    }

    .quiz-feedback.erro {
      background-color: var(--cor-erro-fundo);
      color: var(--cor-erro-texto);
    }

    .acoes-json {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .status-mensagem {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.94rem;
      font-weight: 600;
      margin-bottom: 12px;
      background-color: var(--cor-primaria-suave);
      color: var(--cor-primaria-texto);
    }

    .status-mensagem.erro {
      background-color: var(--cor-erro-fundo);
      color: var(--cor-erro-texto);
    }

    .estado-vazio {
      background-color: var(--cor-superficie);
      border: 1px dashed var(--cor-borda-forte);
      border-radius: var(--raio);
      padding: 24px 16px;
      text-align: center;
      color: var(--cor-texto-sec);
    }

    .oculto {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="topo-safe-area" aria-hidden="true"></div>
  <main class="app-container">
    <header class="cabecalho">
      <div class="marca">
        <h1>Dicionário EN–PT</h1>
        <p class="marca-sub" id="marca-sub-qtd">800 palavras essenciais</p>
      </div>
      <div class="topo-direita">
        <div class="pilula-progresso" aria-label="Progresso de estudo">
          <span class="pilula-item" title="Dias seguidos estudando">
            <svg class="icone cor-fogo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2c.5 4-3 6-3 10a4 4 0 0 0 8 0c0-2.5-1.5-4.5-2-6 2.5 1.5 4 4.2 4 7a7 7 0 1 1-14 0c0-4.2 3-7.5 7-11Z"/>
            </svg>
            <span id="stat-streak">0d</span>
          </span>
          <span class="pilula-sep" aria-hidden="true"></span>
          <span class="pilula-item" title="Palavras estudadas">
            <span id="stat-estudadas">0/800</span>
          </span>
        </div>
        <button type="button" id="btn-tema" class="btn-icone" aria-label="Alternar tema claro ou escuro" title="Alternar tema"></button>
      </div>
    </header>

    <div id="banner-offline" class="banner-offline" role="status">
      Modo offline ativo. O dicionário e suas revisões continuam funcionando normalmente.
    </div>

    <!-- Barra de abas (rodapé no mobile, topo no desktop) -->
    <nav class="abas" aria-label="Navegação principal">
      <button type="button" id="aba-dicionario" class="aba-btn ativa" aria-pressed="true">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
        <span>Dicionário</span>
      </button>
      <button type="button" id="aba-flashcards" class="aba-btn" aria-pressed="false">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="6" width="16" height="14" rx="2"/>
          <path d="M7 3h13a2 2 0 0 1 2 2v11"/>
        </svg>
        <span>Flashcards</span>
      </button>
      <button type="button" id="aba-quiz" class="aba-btn" aria-pressed="false">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span>Quiz</span>
      </button>
      <button type="button" id="aba-minhas" class="aba-btn" aria-pressed="false">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
        </svg>
        <span>Salvas</span>
      </button>
    </nav>

    <!-- =============================================================== -->
    <!-- PAINEL 1: DICIONÁRIO                                            -->
    <!-- =============================================================== -->
    <section id="painel-dicionario">
      <div class="busca-wrapper">
        <div class="busca-caixa">
          <svg class="icone busca-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="text"
            inputmode="search"
            enterkeyhint="search"
            id="campo-busca"
            class="busca-input"
            placeholder="Buscar em inglês ou português..."
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            aria-label="Buscar palavra em inglês ou português"
            aria-autocomplete="list"
            aria-controls="lista-sugestoes"
          >
          <button type="button" id="btn-limpar-busca" class="btn-limpar btn-icone" aria-label="Limpar busca">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <ul id="lista-sugestoes" class="lista-sugestoes" role="listbox" aria-label="Sugestões de palavras"></ul>
      </div>

      <div class="filtros-linha">
        <select id="select-tema" aria-label="Filtrar por tema"></select>
        <select id="select-nivel" aria-label="Filtrar por nível">
          <option value="todos">Todos os níveis</option>
          <option value="A1">Nível A1</option>
          <option value="A2">Nível A2</option>
          <option value="B1">Nível B1</option>
        </select>
      </div>

      <div id="card-palavra-dia" class="faixa-palavra-dia"></div>

      <article id="card-detalhe" class="card-palavra" aria-live="polite"></article>

      <!-- Tradutor rápido inline -->
      <div id="tradutor-rapido" class="tradutor-wrapper">
        <div class="tradutor-cabecalho">
          <span id="tradutor-label-origem" class="tradutor-lang-label">Português</span>
          <button type="button" id="btn-tradutor-trocar" class="tradutor-btn-trocar" aria-label="Trocar idiomas" title="Trocar idiomas">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </button>
          <span id="tradutor-label-destino" class="tradutor-lang-label">Inglês</span>
        </div>
        <div class="tradutor-entrada-wrapper">
          <textarea
            id="tradutor-entrada"
            class="tradutor-campo"
            placeholder="Digite em português..."
            rows="1"
            autocomplete="off"
            autocapitalize="sentences"
            spellcheck="true"
            aria-label="Texto para traduzir"
          ></textarea>
          <button type="button" id="btn-tradutor-ouvir-original" class="btn-icone" style="display:none;" aria-label="Ouvir original" title="Ouvir original">
            <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </button>
        </div>
        <div class="tradutor-divisor"></div>
        <div class="tradutor-cabecalho" style="padding-bottom:0;">
          <span id="tradutor-label-resultado" class="tradutor-lang-label">Inglês</span>
        </div>
        <div class="tradutor-resultado-wrapper">
          <div id="tradutor-resultado" class="tradutor-resultado placeholder">Tradução aparece aqui...</div>
          <div class="tradutor-resultado-acoes" id="tradutor-acoes" style="display:none;">
            <button type="button" id="btn-tradutor-ouvir" class="btn-icone" aria-label="Ouvir tradução" title="Ouvir tradução">
              <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="tradutor-alternativas" class="tradutor-alternativas" style="display:none;"></div>
      </div>

      <button type="button" id="btn-toggle-vocabulario" class="btn-vocabulario-toggle" aria-expanded="false" aria-controls="lista-palavras">
        <span id="titulo-lista-palavras" class="vocabulario-toggle-esq">Vocabulário (800)</span>
        <span class="vocabulario-toggle-dir">
          <span id="texto-toggle-vocabulario">Ver lista</span>
          <svg class="icone vocabulario-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </span>
      </button>
      <div id="lista-palavras" class="grade-palavras oculto"></div>
    </section>

    <!-- =============================================================== -->
    <!-- PAINEL 2: FLASHCARDS (REPETIÇÃO ESPAÇADA SIMPLES)               -->
    <!-- =============================================================== -->
    <section id="painel-flashcards" class="oculto">
      <div class="card-painel">
        <div class="controles-estudo">
          <div class="campo-grupo">
            <label for="fc-modo">Conjunto para revisar</label>
            <select id="fc-modo">
              <option value="devidas">Devidas hoje (repetição espaçada)</option>
              <option value="minhas">Minhas palavras salvas</option>
              <option value="todas">Todas as palavras</option>
            </select>
          </div>
          <div class="campo-grupo">
            <label for="fc-tema">Filtrar tema</label>
            <select id="fc-tema"></select>
          </div>
        </div>
        <button type="button" id="btn-fc-reiniciar" class="btn-suave btn-largura-total">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Montar nova sessão
        </button>
      </div>

      <div id="fc-conteudo"></div>
    </section>

    <!-- =============================================================== -->
    <!-- PAINEL 3: QUIZ DE MÚLTIPLA ESCOLHA                              -->
    <!-- =============================================================== -->
    <section id="painel-quiz" class="oculto">
      <div class="card-painel">
        <div class="controles-estudo">

  <!-- Carrega o banco de 800 palavras offline -->
  <script src="palavras.js"></script>
  <script>
    // =========================================================================
    // CONSTANTES, ÍCONES SVG E HELPERS DE STORAGE SEGURO (try/catch em tudo)
    // =========================================================================
    const LISTA_PALAVRAS = Array.isArray(window.BANCO_PALAVRAS) || typeof BANCO_PALAVRAS !== "undefined"
      ? BANCO_PALAVRAS
      : [];

    const STORAGE_TEMA = "dic_en_pt_tema";

    const STORAGE_SRS = "dic_en_pt_srs";
    const STORAGE_PROGRESSO = "dic_en_pt_progresso";
    const STORAGE_PALAVRAS_EXTRAS = "dic_en_pt_extras_v1";

    const TEMAS_DISPONIVEIS = [
      { id: "todos", label: "Todos os temas" },
      { id: "viagem", label: "Viagem" },
      { id: "trabalho", label: "Trabalho" },
      { id: "comida", label: "Comida" },
      { id: "tecnologia", label: "Tecnologia" },
      { id: "emoções", label: "Emoções" },
      { id: "casa", label: "Casa e Rotina" },
      { id: "família", label: "Família e Pessoas" },
      { id: "saúde", label: "Saúde e Corpo" },
      { id: "compras", label: "Compras e Dinheiro" },
      { id: "tempo", label: "Tempo e Clima" },
      { id: "essenciais", label: "Verbos e Conectivos" },

    ];

    const INTERVALOS_SRS_DIAS = [0, 1, 3, 7, 14, 30];

    // Ícones SVG uniformes para manter o visual limpo sem emojis
    function iconeSvg(tipo) {
      const mapas = {
        volume: '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>',
        salvo: '<svg class="icone" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>',
        salvar: '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>',
        sol: '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>',
        lua: '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
        alerta: '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        olho: '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>',
        certo: '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
        errado: '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
      };
      return mapas[tipo] || "";
    }

    function lerStorage(chave, valorPadrao) {
      try {
        const bruto = window.localStorage.getItem(chave);
        if (bruto === null) return valorPadrao;
        return JSON.parse(bruto);
      } catch (erro) {
        return valorPadrao;
      }
    }

    function salvarStorage(chave, valor) {
      try {
        window.localStorage.setItem(chave, JSON.stringify(valor));
        return true;
      } catch (erro) {
        return false;
      }
    }

    function normalizarTexto(texto) {
      return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function escaparHtml(texto) {
      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function obterDataLocalISO(deslocamentoDias = 0) {
      const data = new Date();
      data.setDate(data.getDate() + deslocamentoDias);
      const ano = data.getFullYear();
      const mes = String(data.getMonth() + 1).padStart(2, "0");
      const dia = String(data.getDate()).padStart(2, "0");
      return `${ano}-${mes}-${dia}`;
    }

    function embaralharArray(lista) {
      const copia = lista.slice();
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    // =========================================================================
    // ESTADO DA APLICAÇÃO
    // =========================================================================
    const extrasSalvasIniciais = lerStorage(STORAGE_PALAVRAS_EXTRAS, []);
    if (Array.isArray(extrasSalvasIniciais)) {
      for (const extra of extrasSalvasIniciais) {
        if (extra && extra.id && extra.palavra && !LISTA_PALAVRAS.some((p) => p.id === extra.id)) {
          LISTA_PALAVRAS.push(extra);
        }
      }
    }

    const salvasIniciais = lerStorage(STORAGE_SALVAS, []);
    const srsInicial = lerStorage(STORAGE_SRS, {});
    const progressoInicial = lerStorage(STORAGE_PROGRESSO, {
      estudadasIds: [],
      diasSeguidos: 0,
      ultimoDia: null
    });

    const estado = {
      abaAtiva: "dicionario",
      temaFiltro: "todos",
      nivelFiltro: "todos",
      termoBusca: "",
      palavraSelecionadaId: LISTA_PALAVRAS[0] ? LISTA_PALAVRAS[0].id : "",
      palavraOnlineAtual: null,
      minhasPalavras: new Set(
        Array.isArray(salvasIniciais)
          ? salvasIniciais.filter((id) => LISTA_PALAVRAS.some((p) => p.id === id))
          : []
      ),
      srs: srsInicial && typeof srsInicial === "object" ? srsInicial : {},
      progresso: {
        estudadasIds: new Set(
          Array.isArray(progressoInicial.estudadasIds) ? progressoInicial.estudadasIds : []
        ),
        diasSeguidos: Number(progressoInicial.diasSeguidos) || 0,
        ultimoDia: progressoInicial.ultimoDia || null
      },
      indiceSugestaoAtiva: -1,
      vozesDisponiveis: [],
      vocabularioAberto: false,
      limiteLista: 40,
      fcFila: [],
      fcVirado: false,
      fcRespondidasSessao: 0,
      quizPerguntas: [],
      quizIndice: 0,
      quizAcertos: 0,
      quizErros: [],
      quizRespondida: false,
      quizEmAndamento: false
    };

    // Referências de DOM
    const elHtml = document.documentElement;
    const elMetaThemeColor = document.getElementById("meta-theme-color");
    const elBtnTema = document.getElementById("btn-tema");
    const elStatStreak = document.getElementById("stat-streak");
    const elStatEstudadas = document.getElementById("stat-estudadas");
    const elBannerOffline = document.getElementById("banner-offline");

    const elAbaDicionario = document.getElementById("aba-dicionario");
    const elAbaFlashcards = document.getElementById("aba-flashcards");
    const elAbaQuiz = document.getElementById("aba-quiz");
    const elAbaMinhas = document.getElementById("aba-minhas");
    const elContadorDevidas = document.getElementById("contador-devidas");
    const elContadorSalvas = document.getElementById("contador-salvas");

    const elPainelDicionario = document.getElementById("painel-dicionario");
    const elPainelFlashcards = document.getElementById("painel-flashcards");
    const elPainelQuiz = document.getElementById("painel-quiz");
    const elPainelMinhas = document.getElementById("painel-minhas");

    const elCardPalavraDia = document.getElementById("card-palavra-dia");
    const elCampoBusca = document.getElementById("campo-busca");
    const elBtnLimparBusca = document.getElementById("btn-limpar-busca");
    const elListaSugestoes = document.getElementById("lista-sugestoes");
    const elSelectTema = document.getElementById("select-tema");
    const elSelectNivel = document.getElementById("select-nivel");
    const elCardDetalhe = document.getElementById("card-detalhe");
    const elBtnToggleVocabulario = document.getElementById("btn-toggle-vocabulario");
    const elTextoToggleVocabulario = document.getElementById("texto-toggle-vocabulario");
    const elTituloLista = document.getElementById("titulo-lista-palavras");
    const elListaPalavras = document.getElementById("lista-palavras");

    const elFcModo = document.getElementById("fc-modo");
    const elFcTema = document.getElementById("fc-tema");
    const elBtnFcReiniciar = document.getElementById("btn-fc-reiniciar");
    const elFcConteudo = document.getElementById("fc-conteudo");

    const elQuizSentido = document.getElementById("quiz-sentido");
    const elQuizFonte = document.getElementById("quiz-fonte");
    const elBtnIniciarQuiz = document.getElementById("btn-iniciar-quiz");
    const elQuizConteudo = document.getElementById("quiz-conteudo");

    const elBtnExportarJson = document.getElementById("btn-exportar-json");
    const elBtnImportarJson = document.getElementById("btn-importar-json");
    const elInputImportarJson = document.getElementById("input-importar-json");
    const elStatusJson = document.getElementById("status-json");
    const elListaMinhas = document.getElementById("lista-minhas-palavras");

    // =========================================================================
    // TEMA CLARO E ESCURO
    // =========================================================================
    function obterTemaEfetivo() {
      const salvo = lerStorage(STORAGE_TEMA, null);
      if (salvo === "light" || salvo === "dark") return salvo;
      const prefereEscuro = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      return prefereEscuro ? "dark" : "light";
    }

    function aplicarTema(temaManual) {
      if (temaManual === "light" || temaManual === "dark") {
        elHtml.setAttribute("data-tema", temaManual);
      } else {
        elHtml.removeAttribute("data-tema");
      }

      const efetivo = temaManual || obterTemaEfetivo();
      elBtnTema.innerHTML = efetivo === "dark" ? iconeSvg("sol") : iconeSvg("lua");
      elBtnTema.setAttribute(
        "aria-label",
        efetivo === "dark" ? "Mudar para tema claro" : "Mudar para tema escuro"
      );
      elBtnTema.setAttribute(
        "title",
        efetivo === "dark" ? "Mudar para tema claro" : "Mudar para tema escuro"
      );
      if (elMetaThemeColor) {
        elMetaThemeColor.setAttribute("content", efetivo === "dark" ? "#0b1120" : "#f6f7f9");
      }
    }

    function alternarTema() {
      const atual = obterTemaEfetivo();
      const proximo = atual === "dark" ? "light" : "dark";
      salvarStorage(STORAGE_TEMA, proximo);
      aplicarTema(proximo);
    }

    // =========================================================================
    // PRONÚNCIA COM SPEECHSYNTHESIS (en-US ou en-GB)
    // =========================================================================
    function atualizarVozes() {
      if (!("speechSynthesis" in window)) return;
      estado.vozesDisponiveis = window.speechSynthesis.getVoices() || [];
    }

    function escolherVozIngles() {
      const vozes = estado.vozesDisponiveis.length
        ? estado.vozesDisponiveis
        : (("speechSynthesis" in window && window.speechSynthesis.getVoices()) || []);

      return (
        vozes.find((v) => v.lang && v.lang.toLowerCase() === "en-us") ||
        vozes.find((v) => v.lang && v.lang.toLowerCase() === "en-gb") ||
        vozes.find((v) => v.lang && v.lang.toLowerCase().startsWith("en-us")) ||
        vozes.find((v) => v.lang && v.lang.toLowerCase().startsWith("en-gb")) ||
        vozes.find((v) => v.lang && v.lang.toLowerCase().startsWith("en")) ||
        null
      );
    }

    // Referência global evita que o Safari/iOS descarte o áudio ou fala antes de tocar
    let falaAtual = null;
    let audioCtxDesbloqueado = null;
    let vozPrimada = false;
    let idReproducaoAtual = 0;
    let timerAudioAtual = null;
    let chaveReprodutorAtual = "";
    const reprodutorAudio = new Audio();
    reprodutorAudio.preload = "auto";
    reprodutorAudio.setAttribute("playsinline", "");

    function construirUrlsAudio(textoLimpo, idioma = "en") {
      const textoCodificado = encodeURIComponent(textoLimpo);
      const tl = idioma === "pt" ? "pt-BR" : "en";
      const urls = [
        `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${textoCodificado}&tl=${tl}&client=gtx`,
        `https://translate.google.com/translate_tts?ie=UTF-8&q=${textoCodificado}&tl=${tl}&client=tw-ob`
      ];
      if (idioma !== "pt") {
        urls.push(`https://dict.youdao.com/dictvoice?audio=${textoCodificado}&type=2`);
      }
      return urls;
    }

    function ativarSessaoPlayback() {
      if ("audioSession" in navigator && navigator.audioSession.type !== "playback") {
        try {
          navigator.audioSession.type = "playback";
        } catch (erro) {
          // Ignora caso o navegador bloqueie alteração
        }
      }
    }

    function desbloquearAudioNoToque() {
      ativarSessaoPlayback();
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          if (!audioCtxDesbloqueado) {
            audioCtxDesbloqueado = new AudioCtx();
          }
          if (audioCtxDesbloqueado.state === "suspended") {
            audioCtxDesbloqueado.resume().catch(() => {});
          }
        }
      } catch (erro) {
        // Ignora
      }
    }

    function limparTimerAudio() {
      if (timerAudioAtual !== null) {
        clearTimeout(timerAudioAtual);
        timerAudioAtual = null;
      }
    }

    function pararAudioAtual() {
      limparTimerAudio();
      reprodutorAudio.onplaying = null;
      reprodutorAudio.ontimeupdate = null;
      reprodutorAudio.onended = null;
      reprodutorAudio.onerror = null;
      try {
        if (!reprodutorAudio.paused) {
          reprodutorAudio.pause();
        }
      } catch (erro) {
        // Ignora
      }
      if ("speechSynthesis" in window) {
        try {
          if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
            window.speechSynthesis.cancel();
          }
        } catch (erro) {
          // Ignora
        }
      }
    }

    // Pré-aquece sessão e vozes do iOS na primeira interação fora dos botões de áudio
    function prepararVozesIOS(evento) {
      if (vozPrimada) return;
      vozPrimada = true;
      desbloquearAudioNoToque();
      if (!("speechSynthesis" in window)) return;
      atualizarVozes();
      if (
        evento &&
        evento.target &&
        evento.target.closest &&
        evento.target.closest("#btn-ouvir-palavra, #btn-fc-ouvir, #btn-quiz-ouvir, #btn-pdd-ouvir, #btn-tradutor-ouvir, #btn-tradutor-ouvir-original, .tradutor-chip, [data-falar-exemplo], [data-ouvir-texto]")
      ) {
        return;
      }
      try {
        const silencio = new SpeechSynthesisUtterance(" ");
        silencio.volume = 0;
        silencio.lang = "en-US";
        window.speechSynthesis.speak(silencio);
      } catch (erro) {
        // Ignora
      }
    }

    function falarComSpeechSynthesis(textoLimpo, elementoAviso, token, idioma = "en") {
      if (token !== idReproducaoAtual) return;

      if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
        if (elementoAviso) {
          elementoAviso.textContent = "Este navegador não suporta leitura de voz.";
          elementoAviso.classList.add("visivel");
        }
        return;
      }

      try {
        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
          window.speechSynthesis.cancel();
        }
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }

        atualizarVozes();
        const fala = new SpeechSynthesisUtterance(textoLimpo);
        falaAtual = fala;

        if (idioma === "pt") {
          const vozPt = estado.vozesDisponiveis.find(
            (v) => v.lang && v.lang.toLowerCase().startsWith("pt")
          );
          if (vozPt) {
            fala.voice = vozPt;
            fala.lang = vozPt.lang;
          } else {
            fala.lang = "pt-BR";
          }
        } else {
          const voz = escolherVozIngles();
          if (voz) {
            fala.voice = voz;
            fala.lang = voz.lang;
          } else {
            fala.lang = "en-US";
          }
        }
        fala.volume = 1;
        fala.rate = 0.94;
        fala.pitch = 1;

        fala.onend = () => {
          if (falaAtual === fala) falaAtual = null;
        };
        fala.onerror = (ev) => {
          if (falaAtual === fala) falaAtual = null;
          if (ev && (ev.error === "canceled" || ev.error === "interrupted")) return;
          if (elementoAviso) {
            const detalhe = ev && ev.error ? ` (${ev.error})` : "";
            elementoAviso.textContent =
              `Não foi possível reproduzir o áudio neste dispositivo${detalhe}.`;
            elementoAviso.classList.add("visivel");
          }
        };

        window.speechSynthesis.speak(fala);
      } catch (erro) {
        if (elementoAviso) {
          elementoAviso.textContent = "Não foi possível reproduzir o áudio neste dispositivo.";
          elementoAviso.classList.add("visivel");
        }
      }
    }

    function tocarListaAudioUrls(urls, indice, token, textoLimpo, elementoAviso, idioma = "en") {
      if (token !== idReproducaoAtual) return;
      if (indice >= urls.length) {
        falarComSpeechSynthesis(textoLimpo, elementoAviso, token, idioma);
        return;
      }

      limparTimerAudio();
      let iniciou = false;
      let falhou = false;

      const tentarProximo = () => {
        if (falhou || token !== idReproducaoAtual) return;
        falhou = true;
        limparTimerAudio();
        reprodutorAudio.onplaying = null;
        reprodutorAudio.ontimeupdate = null;
        reprodutorAudio.onended = null;
        reprodutorAudio.onerror = null;
        tocarListaAudioUrls(urls, indice + 1, token, textoLimpo, elementoAviso, idioma);
      };

      const marcarIniciou = () => {
        if (token !== idReproducaoAtual) return;
        iniciou = true;
        limparTimerAudio();
      };

      reprodutorAudio.onplaying = marcarIniciou;
      reprodutorAudio.ontimeupdate = marcarIniciou;
      reprodutorAudio.onended = () => {
        if (token !== idReproducaoAtual) return;
        limparTimerAudio();
        reprodutorAudio.onplaying = null;
        reprodutorAudio.ontimeupdate = null;
        reprodutorAudio.onended = null;
        reprodutorAudio.onerror = null;
      };
      reprodutorAudio.onerror = tentarProximo;

      reprodutorAudio.src = urls[indice];
      timerAudioAtual = setTimeout(() => {
        if (!iniciou && token === idReproducaoAtual) {
          tentarProximo();
        }
      }, 1800);

      try {
        const promessa = reprodutorAudio.play();
        if (promessa && typeof promessa.catch === "function") {
          promessa.catch((erro) => {
            if (erro && erro.name === "AbortError") return;
            chaveReprodutorAtual = "";
            tentarProximo();
          });
        }
      } catch (erro) {
        chaveReprodutorAtual = "";
        tentarProximo();
      }
    }

    function falarTexto(texto, elementoAviso, idioma = "en") {
      const textoLimpo = String(texto || "").trim();
      if (!textoLimpo) return;

      desbloquearAudioNoToque();
      const token = ++idReproducaoAtual;
      pararAudioAtual();
      if (elementoAviso) elementoAviso.classList.remove("visivel");

      // Online: Google TTS sem Referer (~200ms) com replay instantâneo para mesma frase
      if (navigator.onLine !== false) {
        const chave = `${idioma}:${textoLimpo.toLowerCase()}`;
        if (chaveReprodutorAtual === chave && reprodutorAudio.readyState >= 2) {
          try {
            reprodutorAudio.currentTime = 0;
            const p = reprodutorAudio.play();
            if (p && typeof p.catch === "function") {
              p.catch(() => {
                chaveReprodutorAtual = "";
                tocarListaAudioUrls(construirUrlsAudio(textoLimpo, idioma), 0, token, textoLimpo, elementoAviso, idioma);
              });
            }
            return;
          } catch (erro) {
            chaveReprodutorAtual = "";
          }
        }
        chaveReprodutorAtual = chave;
        const urls = construirUrlsAudio(textoLimpo, idioma);
        tocarListaAudioUrls(urls, 0, token, textoLimpo, elementoAviso, idioma);
        return;
      }

      falarComSpeechSynthesis(textoLimpo, elementoAviso, token, idioma);
    }

    // =========================================================================
    // PROGRESSO, STREAK E PALAVRA DO DIA
    // =========================================================================
    function calcularStreakAtual() {
      const hoje = obterDataLocalISO(0);
      const ontem = obterDataLocalISO(-1);
      if (estado.progresso.ultimoDia === hoje || estado.progresso.ultimoDia === ontem) {
        return estado.progresso.diasSeguidos;
      }
      return 0;
    }

    function registrarEstudo(palavraId) {
      if (palavraId) {
        estado.progresso.estudadasIds.add(palavraId);
      }

      const hoje = obterDataLocalISO(0);
      const ontem = obterDataLocalISO(-1);

      if (estado.progresso.ultimoDia !== hoje) {
        if (estado.progresso.ultimoDia === ontem) {
          estado.progresso.diasSeguidos += 1;
        } else {
          estado.progresso.diasSeguidos = 1;
        }
        estado.progresso.ultimoDia = hoje;
      }

      salvarStorage(STORAGE_PROGRESSO, {
        estudadasIds: Array.from(estado.progresso.estudadasIds),
        diasSeguidos: estado.progresso.diasSeguidos,
        ultimoDia: estado.progresso.ultimoDia
      });

      renderizarBarraProgresso();
    }

    function renderizarBarraProgresso() {
      const dias = calcularStreakAtual();
      elStatStreak.textContent = `${dias}d`;
      elStatEstudadas.textContent = `${estado.progresso.estudadasIds.size}/${LISTA_PALAVRAS.length}`;
      if (elContadorDevidas) {

        elContadorDevidas.textContent = devidas > 0 ? `(${devidas})` : "";
      }
    }

    function obterPalavraDoDia() {
      const hoje = obterDataLocalISO(0);
      let hash = 0;
      for (let i = 0; i < hoje.length; i++) {
        hash = (hash * 31 + hoje.charCodeAt(i)) % LISTA_PALAVRAS.length;
      }
      return LISTA_PALAVRAS[hash];
    }

    // =========================================================================
    // SELETORES CUSTOMIZADOS (MENU DROPDOWN NO ESTILO DO APLICATIVO)
    // =========================================================================
    const selectsCustomizados = new Map();

    function fecharTodosSelects(excetoSelect = null) {
      for (const [selectEl, ui] of selectsCustomizados.entries()) {
        if (selectEl !== excetoSelect) {
          ui.menu.classList.remove("aberto");
          ui.trigger.setAttribute("aria-expanded", "false");
        }
      }
    }

    function sincronizarSelectCustomizado(selectEl) {
      const ui = selectsCustomizados.get(selectEl);
      if (!ui) return;

      const opcaoAtual = selectEl.options[selectEl.selectedIndex];
      ui.label.textContent = opcaoAtual ? opcaoAtual.textContent : "";

      ui.menu.innerHTML = Array.from(selectEl.options)
        .map((opt) => {
          const ativa = opt.value === selectEl.value;
          return `
            <li role="option" aria-selected="${ativa}">
              <button type="button" class="select-opcao ${ativa ? "ativa" : ""}" data-val="${escaparHtml(opt.value)}">
                <span>${escaparHtml(opt.textContent)}</span>
                ${ativa ? `<span style="color:var(--cor-primaria);display:inline-flex;">${iconeSvg("certo")}</span>` : ""}
              </button>
            </li>
          `;
        })
        .join("");
    }

    function criarSelectCustomizado(selectEl, alinharDireita = false) {
      if (!selectEl || selectsCustomizados.has(selectEl)) return;

      const wrapper = document.createElement("div");
      wrapper.className = alinharDireita ? "select-custom alinhar-direita" : "select-custom";

      const trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "select-trigger";
      trigger.setAttribute("aria-haspopup", "listbox");
      trigger.setAttribute("aria-expanded", "false");
      if (selectEl.getAttribute("aria-label")) {
        trigger.setAttribute("aria-label", selectEl.getAttribute("aria-label"));
      }

      const labelSpan = document.createElement("span");
      labelSpan.className = "select-trigger-texto";

      const chevron = document.createElement("span");
      chevron.className = "select-chevron";
      chevron.style.display = "inline-flex";
      chevron.innerHTML =
        '<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';

      trigger.appendChild(labelSpan);
      trigger.appendChild(chevron);

      const menu = document.createElement("ul");
      menu.className = "select-menu";
      menu.setAttribute("role", "listbox");

      selectEl.classList.add("select-nativo-oculto");
      selectEl.parentNode.insertBefore(wrapper, selectEl);
      wrapper.appendChild(trigger);
      wrapper.appendChild(menu);
      wrapper.appendChild(selectEl);

      selectsCustomizados.set(selectEl, { wrapper, trigger, label: labelSpan, menu });
      sincronizarSelectCustomizado(selectEl);

      trigger.addEventListener("click", (evento) => {
        evento.stopPropagation();
        const aberto = menu.classList.contains("aberto");
        fecharSugestoes();
        fecharTodosSelects(aberto ? null : selectEl);
        menu.classList.toggle("aberto", !aberto);
        trigger.setAttribute("aria-expanded", String(!aberto));
      });

      menu.addEventListener("click", (evento) => {
        const btn = evento.target.closest(".select-opcao");
        if (!btn) return;
        const val = btn.getAttribute("data-val");
        if (val !== null && selectEl.value !== val) {
          selectEl.value = val;
          selectEl.dispatchEvent(new Event("change", { bubbles: true }));
        }
        sincronizarSelectCustomizado(selectEl);
        fecharTodosSelects();
        trigger.focus();
      });

      selectEl.addEventListener("change", () => sincronizarSelectCustomizado(selectEl));
    }
