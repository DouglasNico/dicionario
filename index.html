    // =========================================================================
    // BUSCA E SUGESTÕES (INGLÊS E PORTUGUÊS)
    // =========================================================================
    function buscarPalavras(termo) {
      const consulta = normalizarTexto(termo);
      if (!consulta) return [];

      const pontuadas = [];
      for (const item of LISTA_PALAVRAS) {
        const en = normalizarTexto(item.palavra);
        const trads = item.traducoes.map(normalizarTexto);
        const plural = item.plural ? normalizarTexto(item.plural) : "";
        const pass = item.formasIrregulares ? normalizarTexto(item.formasIrregulares.passado) : "";
        const part = item.formasIrregulares ? normalizarTexto(item.formasIrregulares.participio) : "";

        let peso = 0;
        if (en === consulta || trads.some((t) => t === consulta)) {
          peso = 100;
        } else if (en.startsWith(consulta) || trads.some((t) => t.startsWith(consulta))) {
          peso = 70;
        } else if (
          en.includes(consulta) ||
          trads.some((t) => t.includes(consulta)) ||
          plural === consulta ||
          pass === consulta ||
          part === consulta
        ) {
          peso = 40;
        }

        if (peso > 0) {
          pontuadas.push({ item, peso });
        }
      }

      pontuadas.sort((a, b) => b.peso - a.peso || a.item.palavra.localeCompare(b.item.palavra));
      return pontuadas.map((p) => p.item);
    }

    function extrairAlternativasGoogle(dados, principal) {
      const vistos = new Set();
      const chavePrincipal = normalizarTexto(String(principal || "").replace(/[!?.]+$/g, ""));
      if (chavePrincipal) vistos.add(chavePrincipal);
      const lista = [];

      const adicionar = (texto) => {
        const limpo = String(texto || "").replace(/[!?.]+$/g, "").trim();
        const chave = normalizarTexto(limpo);
        if (!limpo || !chave || vistos.has(chave)) return;
        vistos.add(chave);
        lista.push(limpo);
      };

      // Dicionário bilíngue (dados[1])
      if (Array.isArray(dados && dados[1])) {
        for (const bloco of dados[1]) {
          if (Array.isArray(bloco && bloco[1])) {
            for (const termo of bloco[1]) adicionar(termo);
          }
        }
      }

      // Traduções alternativas (dados[5])
      if (Array.isArray(dados && dados[5])) {
        for (const bloco of dados[5]) {
          if (Array.isArray(bloco && bloco[2])) {
            for (const alt of bloco[2]) {
              if (alt && alt[0]) adicionar(alt[0]);
            }
          }
        }
      }

      return lista;
    }

    function ipaParaComoLer(ipa) {
      if (!ipa) return "";
      let s = String(ipa).replace(/[\/\[\]ˈˌ.]/g, "").trim();
      if (!s) return "";
      const pares = [
        ["tʃ", "tch"], ["dʒ", "dj"], ["eɪ", "êi"], ["aɪ", "ai"], ["ɔɪ", "ói"],
        ["aʊ", "au"], ["oʊ", "ôu"], ["əʊ", "ôu"], ["ɪə", "ía"], ["eə", "éa"],
        ["ʊə", "úa"], ["iː", "ii"], ["uː", "uu"], ["ɔː", "óo"], ["ɑː", "áa"],
        ["ɜː", "êr"], ["ər", "âr"], ["ɚ", "âr"], ["θ", "f"], ["ð", "d"],
        ["ʃ", "x"], ["ʒ", "j"], ["ŋ", "ng"], ["æ", "é"], ["ɛ", "é"],
        ["ɪ", "i"], ["ʊ", "u"], ["ʌ", "â"], ["ə", "â"], ["ɒ", "ó"],
        ["ɔ", "ó"], ["ɑ", "á"], ["j", "i"], ["w", "u"], ["ɹ", "r"]
      ];
      for (const [de, para] of pares) {
        s = s.split(de).join(para);
      }
      return s;
    }

    const TRADUCOES_CLASSES = {
      noun: "substantivo",
      verb: "verbo",
      adjective: "adjetivo",
      adverb: "advérbio",
      pronoun: "pronome",
      preposition: "preposição",
      conjunction: "conjunção",
      interjection: "interjeição"
    };

    const cacheTraducoes = new Map();

    function parseRespostaGoogle(dados, limpo) {
      let resultado = "";
      if (dados && dados[0]) {
        for (const parte of dados[0]) {
          if (parte && parte[0]) resultado += parte[0];
        }
      }
      const ehPalavraUnica = !limpo.includes(" ");
      const entradaDic =
        dados &&
        Array.isArray(dados[1]) &&
        dados[1][0] &&
        Array.isArray(dados[1][0][2]) &&
        dados[1][0][2][0];
      const pesoDic = entradaDic && typeof entradaDic[3] === "number" ? entradaDic[3] : 0;
      const termoDic =
        entradaDic && entradaDic[0] ? String(entradaDic[0]).replace(/[!?.]+$/g, "").trim() : "";

      let principal = (resultado || limpo).trim();
      const alternativas = [];
      if (ehPalavraUnica && pesoDic >= 0.8 && termoDic) {
        if (normalizarTexto(termoDic) !== normalizarTexto(principal)) {
          alternativas.push(principal);
        }
        principal = termoDic;
      }

      for (const alt of extrairAlternativasGoogle(dados, principal)) {
        if (!alternativas.some((x) => normalizarTexto(x) === normalizarTexto(alt))) {
          alternativas.push(alt);
        }
      }

      const exemplos = [];
      if (Array.isArray(dados && dados[13])) {
        for (const ex of dados[13][0] || []) {
          if (ex && ex[0] && exemplos.length < 2) {
            const textoEx = String(ex[0]).replace(/<\/?b>/g, "").trim();
            if (textoEx) exemplos.push(textoEx);
          }
        }
      }

      return {
        texto: principal,
        alternativas,
        idiomaDetectado: dados && dados[2] ? String(dados[2]) : "",
        exemplos
      };
    }

    async function consultarTraducaoApi({ sl, tl, q, comExemplos = false }) {
      const limpo = String(q || "").trim();
      if (!limpo) throw new Error("Texto vazio");

      const chaveCache = `${sl}|${tl}|${comExemplos ? "1" : "0"}|${limpo}`;
      if (cacheTraducoes.has(chaveCache)) {
        return cacheTraducoes.get(chaveCache);
      }

      const dts = comExemplos ? "dt=t&dt=bd&dt=at&dt=ex" : "dt=t&dt=bd&dt=at";
      const enc = encodeURIComponent(limpo);
      const endpointsGoogle = [
        `https://clients5.google.com/translate_a/single?client=dict-chrome-ex&sl=${sl}&tl=${tl}&${dts}&q=${enc}`,
        `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&${dts}&q=${enc}`
      ];

      for (const url of endpointsGoogle) {
        try {
          const resp = await fetch(url, { referrerPolicy: "no-referrer" });
          if (!resp.ok) continue;
          const dados = await resp.json();
          const convertido = parseRespostaGoogle(dados, limpo);
          if (convertido.texto) {
            if (cacheTraducoes.size >= 80) {
              cacheTraducoes.delete(cacheTraducoes.keys().next().value);
            }
            cacheTraducoes.set(chaveCache, convertido);
            return convertido;
          }
        } catch (erro) {
          // Tenta o próximo provedor
        }
      }

      // Fallback público oficial (MyMemory) caso Google limite requisições
      const slMy = sl === "auto" ? (tl === "pt" ? "en" : "pt") : sl;
      try {
        const respMy = await fetch(
          `https://api.mymemory.translated.net/get?q=${enc}&langpair=${slMy}|${tl}`,
          { referrerPolicy: "no-referrer" }
        );
        if (respMy.ok) {
          const dadosMy = await respMy.json();
          const trad = dadosMy && dadosMy.responseData && dadosMy.responseData.translatedText;
          if (trad) {
            const alts = Array.isArray(dadosMy.matches)
              ? dadosMy.matches
                  .map((m) => (m && m.translation ? String(m.translation).trim() : ""))
                  .filter(
                    (t) =>
                      t &&
                      normalizarTexto(t) !== normalizarTexto(trad) &&
                      normalizarTexto(t) !== normalizarTexto(limpo)
                  )
              : [];
            const res = {
              texto: String(trad).trim(),
              alternativas: Array.from(new Set(alts)).slice(0, 4),
              idiomaDetectado: slMy,
              exemplos: []
            };
            cacheTraducoes.set(chaveCache, res);
            return res;
          }
        }
      } catch (erro) {
        // Segue para fallback local
      }

      // Último recurso: tenta encontrar no dicionário local de 800 palavras
      const norm = normalizarTexto(limpo);
      const local = LISTA_PALAVRAS.find(
        (p) => normalizarTexto(p.palavra) === norm || p.traducoes.some((t) => normalizarTexto(t) === norm)
      );
      if (local) {
        const ehEn = normalizarTexto(local.palavra) === norm;
        const destino = tl === "en" ? local.palavra : local.traducoes[0];
        return {
          texto: destino,
          alternativas: ehEn ? local.traducoes.slice(1) : [],
          idiomaDetectado: ehEn ? "en" : "pt",
          exemplos: []
        };
      }

      throw new Error("Sem conexão com o tradutor");
    }

    let buscaOnlineToken = 0;

    async function buscarPalavraOnline(termoBruto) {
      const termo = String(termoBruto || "").trim();
      if (!termo) return;
      const token = ++buscaOnlineToken;
      fecharSugestoes();

      elCardDetalhe.innerHTML = `
        <div class="estado-vazio" style="padding:24px 8px;">
          Buscando <strong>${escaparHtml(termo)}</strong> no dicionário completo...
        </div>
      `;

      try {
        const resAuto = await consultarTraducaoApi({
          sl: "auto",
          tl: "pt",
          q: termo,
          comExemplos: true
        });
        if (token !== buscaOnlineToken) return;

        const idiomaDetectado = resAuto.idiomaDetectado || "en";
        let palavraEn = termo;
        let traducoesPt = [];

        if (idiomaDetectado.startsWith("pt")) {
          const resEn = await consultarTraducaoApi({ sl: "pt", tl: "en", q: termo });
          if (token !== buscaOnlineToken) return;
          palavraEn = resEn.texto.replace(/[!?.]+$/g, "").trim() || termo;
          traducoesPt = [termo];
        } else {
          const limpoPt = resAuto.texto.replace(/[!?.]+$/g, "").trim() || termo;
          traducoesPt = [limpoPt, ...resAuto.alternativas].slice(0, 6);
        }

        // Busca definição, fonética e exemplos em inglês
        let classe = "palavra";
        let ipa = "";
        const exemplosEn = [];
        const palavraBaseLookup = palavraEn.split(/\s+/)[0].replace(/[^a-zA-Z'-]/g, "");

        if (palavraBaseLookup && palavraEn.split(/\s+/).length <= 2) {
          try {
            const respDic = await fetch(
              `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(palavraEn.toLowerCase())}`
            );
            if (respDic.ok) {
              const entradas = await respDic.json();
              const entrada = Array.isArray(entradas) ? entradas[0] : null;
              if (entrada) {
                ipa =
                  entrada.phonetic ||
                  (Array.isArray(entrada.phonetics) &&
                    (entrada.phonetics.find((p) => p && p.text) || {}).text) ||
                  "";
                if (Array.isArray(entrada.meanings) && entrada.meanings.length > 0) {
                  const pos = entrada.meanings[0].partOfSpeech || "";
                  classe = TRADUCOES_CLASSES[pos] || pos || "palavra";
                  for (const m of entrada.meanings) {
                    if (!Array.isArray(m.definitions)) continue;
                    for (const d of m.definitions) {
                      if (d && d.example && exemplosEn.length < 2) {
                        exemplosEn.push(d.example);
                      }
                    }
                  }
                }
              }
            }
          } catch (erro) {
            // Ignora falha na API complementar
          }
        }

        if (exemplosEn.length === 0 && !idiomaDetectado.startsWith("pt") && resAuto.exemplos.length > 0) {
          exemplosEn.push(...resAuto.exemplos.slice(0, 2));
        }

        if (exemplosEn.length === 0) {
          exemplosEn.push(
            palavraEn.includes(" ")
              ? `How do you say "${palavraEn}"?`
              : `I learned the word ${palavraEn} today.`
          );
        }

        const exemplos = [];
        try {
          const resEx = await consultarTraducaoApi({
            sl: "en",
            tl: "pt",
            q: exemplosEn.join("\n")
          });
          const tradsEx = resEx.texto.split("\n");
          for (let i = 0; i < exemplosEn.length; i++) {
            exemplos.push({
              en: exemplosEn[i],
              pt: (tradsEx[i] || "").trim() || "Exemplo em inglês"
            });
          }
        } catch (erro) {
          for (const en of exemplosEn) {
            exemplos.push({ en, pt: "Exemplo em inglês" });
          }
        }

        if (token !== buscaOnlineToken) return;

        if (idiomaDetectado.startsWith("pt")) {
          try {
            const resPt = await consultarTraducaoApi({ sl: "en", tl: "pt", q: palavraEn });
            const extras = [resPt.texto, ...resPt.alternativas].filter(
              (t) => normalizarTexto(t) !== normalizarTexto(termo)
            );
            traducoesPt = [termo, ...extras].slice(0, 5);
          } catch (erro) {
            // Mantém termo original
          }
        }

        const comoLer = ipaParaComoLer(ipa);
        const idGerado =
          "online_" +
          normalizarTexto(palavraEn)
            .replace(/[^a-z0-9]+/g, "_")
            .replace(/^_|_$/g, "");

        const existente = LISTA_PALAVRAS.find((p) => p.id === idGerado);
        if (existente) {
          selecionarPalavra(existente.id, true);
          return;
        }

        const itemOnline = {
          id: idGerado || `online_${Date.now()}`,
          palavra: palavraEn,
          ipa: ipa || "",
          pronuncia: comoLer ? `${comoLer} (aprox.)` : "Ouça a pronúncia no botão acima",
          classe,
          tema: "online",
          nivel: "Online",
          traducoes: traducoesPt,
          exemplos,
          plural: null,
          formasIrregulares: null,
          falsoCognato: null,
          revisar: false,
          online: true
        };

        estado.palavraOnlineAtual = itemOnline;
        estado.palavraSelecionadaId = itemOnline.id;
        renderizarCardDetalhe();
      } catch (erro) {
        if (token !== buscaOnlineToken) return;
        elCardDetalhe.innerHTML = `
          <div class="estado-vazio" style="padding:24px 8px;">
            Não foi possível buscar <strong>${escaparHtml(termo)}</strong> online. Verifique sua conexão com a internet.
          </div>
        `;
      }
    }

    function renderizarSugestoes() {
      const termo = estado.termoBusca.trim();
      if (!termo) {
        elListaSugestoes.innerHTML = "";
        elListaSugestoes.classList.remove("aberta");
        estado.indiceSugestaoAtiva = -1;
        return;
      }

      const resultados = buscarPalavras(termo).slice(0, 8);
      const consultaNorm = normalizarTexto(termo);
      const temExata = resultados.some(
        (item) =>
          normalizarTexto(item.palavra) === consultaNorm ||
          item.traducoes.some((t) => normalizarTexto(t) === consultaNorm)
      );

      let html = resultados
        .map((item, idx) => {
          const ativa = idx === estado.indiceSugestaoAtiva ? "selecionada" : "";
          return `
            <li role="option" aria-selected="${idx === estado.indiceSugestaoAtiva}">
              <button type="button" class="sugestao-btn ${ativa}" data-id="${escaparHtml(item.id)}">
                <span class="sugestao-principal">
                  <span class="sugestao-palavra">${escaparHtml(item.palavra)}</span>
                  <span class="sugestao-trad">${escaparHtml(item.traducoes.join(", "))}</span>
                </span>
                <span class="sugestao-pron">${escaparHtml(item.pronuncia || item.ipa)}</span>
              </button>
            </li>
          `;
        })
        .join("");

      if (navigator.onLine !== false && termo.length >= 2 && !temExata) {
        const idxOnline = resultados.length;
        const ativaOnline = idxOnline === estado.indiceSugestaoAtiva ? "selecionada" : "";
        html += `
          <li role="option" aria-selected="${idxOnline === estado.indiceSugestaoAtiva}">
            <button type="button" class="sugestao-btn sugestao-online ${ativaOnline}" data-online-termo="${escaparHtml(termo)}">
              <span class="sugestao-principal">
                <span class="sugestao-palavra">Buscar “${escaparHtml(termo)}” online</span>
                <span class="sugestao-trad">Dicionário completo (qualquer palavra EN/PT)</span>
              </span>
              <span class="sugestao-pron">Internet</span>
            </button>
          </li>
        `;
      } else if (resultados.length === 0) {
        html = '<li class="sugestao-vazio">Nenhuma palavra encontrada offline.</li>';
      }

      elListaSugestoes.innerHTML = html;
      elListaSugestoes.classList.add("aberta");
    }

    function fecharSugestoes() {
      elListaSugestoes.classList.remove("aberta");
      estado.indiceSugestaoAtiva = -1;
    }

    function obterPalavraPorId(id) {
      return (
        LISTA_PALAVRAS.find((p) => p.id === id) ||
        (estado.palavraOnlineAtual && estado.palavraOnlineAtual.id === id
          ? estado.palavraOnlineAtual
          : null)
      );
    }

    // =========================================================================
    // CARD DE DETALHE E LISTA DO VOCABULÁRIO
    // =========================================================================
    function renderizarCardDetalhe() {
      const item = obterPalavraPorId(estado.palavraSelecionadaId) || LISTA_PALAVRAS[0];
      if (!item) return;

      const estaSalva = estado.minhasPalavras.has(item.id);
      const badgeRevisar = item.revisar
        ? '<span class="badge-revisar">Em revisão</span>'
        : item.online
          ? '<span class="badge-online">Online</span>'
          : "";

      const blocoFalsoCognato = item.falsoCognato
        ? `
          <div class="alerta-falso-cognato" role="alert">
            ${iconeSvg("alerta")}
            <div>
              <strong>Falso cognato — atenção</strong>
              <span>${escaparHtml(item.falsoCognato)}</span>
            </div>
          </div>
        `
        : "";

      let textoFormas = "";
      if (item.classe === "substantivo" && item.plural) {
        textoFormas = `<p class="info-formas"><strong>Plural:</strong> ${escaparHtml(item.plural)}</p>`;
      } else if (item.classe === "verbo") {
        if (item.formasIrregulares) {
          textoFormas = `<p class="info-formas"><strong>Verbo irregular:</strong> Passado: <em>${escaparHtml(
            item.formasIrregulares.passado
          )}</em> · Particípio: <em>${escaparHtml(item.formasIrregulares.participio)}</em></p>`;
        } else {
          textoFormas = `<p class="info-formas"><strong>Flexão:</strong> Verbo regular (-ed no passado)</p>`;
        }
      }

      const secaoFormas = textoFormas
        ? `
          <div class="secao-card">
            <h3 class="secao-titulo">Formas da palavra</h3>
            ${textoFormas}
          </div>
        `
        : "";

      const htmlExemplos = item.exemplos
        .map(
          (ex, idx) => `
          <div class="exemplo-item">
            <div class="exemplo-textos">
              <p class="exemplo-en">${escaparHtml(ex.en)}</p>
              <p class="exemplo-pt">${escaparHtml(ex.pt)}</p>
            </div>
            <button
              type="button"
              class="btn-icone btn-suave"
              data-falar-exemplo="${idx}"
              aria-label="Ouvir frase de exemplo ${idx + 1}"
              title="Ouvir frase"
            >
              ${iconeSvg("volume")}
            </button>
          </div>
        `
        )
        .join("");

      elCardDetalhe.innerHTML = `
        <div class="card-topo">
          <div>
            <h2 class="palavra-titulo">${escaparHtml(item.palavra)}</h2>
            <p class="meta-inline">${escaparHtml(item.classe)} · ${escaparHtml(item.nivel)} · ${escaparHtml(item.tema)}</p>
          </div>
          ${badgeRevisar}
        </div>

        <div class="linha-pronuncia">
          Como ler: ${escaparHtml(item.pronuncia || item.ipa)}
        </div>

        <div class="acoes-palavra">
          <button type="button" id="btn-ouvir-palavra" class="btn-primario">
            ${iconeSvg("volume")}
            <span>Ouvir</span>
          </button>
          <button
            type="button"
            id="btn-salvar-palavra"
            class="btn-salvar"
            aria-pressed="${estaSalva}"
          >
            ${estaSalva ? iconeSvg("salvo") : iconeSvg("salvar")}
            <span>${estaSalva ? "Salva" : "Salvar"}</span>
          </button>
        </div>

        <p id="aviso-voz" class="aviso-voz" role="status"></p>

        ${blocoFalsoCognato}

        <div class="secao-card" style="margin-top:0;padding-top:0;border-top:none;">
          <h3 class="secao-titulo">Traduções</h3>
          <ol class="lista-traducoes">
            ${item.traducoes.map((t) => `<li>${escaparHtml(t)}</li>`).join("")}
          </ol>
        </div>

        ${secaoFormas}

        <div class="secao-card">
          <h3 class="secao-titulo">Exemplos</h3>
          ${htmlExemplos}
        </div>
      `;

      const avisoVoz = document.getElementById("aviso-voz");
      document.getElementById("btn-ouvir-palavra").addEventListener("click", () => {
        falarTexto(item.palavra, avisoVoz);
      });

      document.getElementById("btn-salvar-palavra").addEventListener("click", () => {
        alternarSalvarPalavra(item.id);
      });

      elCardDetalhe.querySelectorAll("[data-falar-exemplo]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-falar-exemplo"));
          const exemplo = item.exemplos[idx];
          if (exemplo) falarTexto(exemplo.en, avisoVoz);
        });
      });
    }

    function obterPalavrasVisiveis() {
      const termo = estado.termoBusca.trim();
      const base = termo ? buscarPalavras(termo) : LISTA_PALAVRAS;
      return base.filter((item) => {
        const okTema = estado.temaFiltro === "todos" || item.tema === estado.temaFiltro;
        const okNivel = estado.nivelFiltro === "todos" || item.nivel === estado.nivelFiltro;
        return okTema && okNivel;
      });
    }

    function criarHtmlItemPalavra(item, ativa, rotuloDireita, mostrarIconeSalva) {
      const salva = mostrarIconeSalva && estado.minhasPalavras.has(item.id);
      return `
        <div class="item-palavra-card ${ativa ? "ativa" : ""}">
          <button type="button" class="item-palavra-abrir" data-id="${escaparHtml(item.id)}">
            <span class="item-esquerda">
              <span class="item-titulo">
                ${salva ? `<span style="color:var(--cor-salvo-texto);display:inline-flex;">${iconeSvg("salvo")}</span>` : ""}
                ${escaparHtml(item.palavra)}
              </span>
              <span class="item-sub">${escaparHtml(item.traducoes.join(", "))}</span>
            </span>
            <span class="item-direita">${escaparHtml(rotuloDireita)}</span>
          </button>
          <button
            type="button"
            class="btn-icone btn-suave btn-item-ouvir"
            data-ouvir-texto="${escaparHtml(item.palavra)}"
            aria-label="Ouvir ${escaparHtml(item.palavra)}"
          >
            ${iconeSvg("volume")}
          </button>
        </div>
      `;
    }

    function renderizarListaPalavras() {
      const lista = obterPalavrasVisiveis();
      elTituloLista.textContent = `Vocabulário (${lista.length})`;
      elBtnToggleVocabulario.setAttribute("aria-expanded", String(estado.vocabularioAberto));
      elTextoToggleVocabulario.textContent = estado.vocabularioAberto ? "Ocultar" : "Ver lista";
      elListaPalavras.classList.toggle("oculto", !estado.vocabularioAberto);

      if (!estado.vocabularioAberto) return;

      if (lista.length === 0) {
        elListaPalavras.innerHTML =
          '<div class="estado-vazio" style="grid-column:1/-1;">Nenhuma palavra corresponde à busca ou ao filtro selecionado.</div>';
        return;
      }

      const visiveis = lista.slice(0, estado.limiteLista);
      const botoesHtml = visiveis
        .map((item) =>
          criarHtmlItemPalavra(
            item,
            item.id === estado.palavraSelecionadaId,
            item.nivel,
            true
          )
        )
        .join("");

      const restante = lista.length - visiveis.length;
      const botaoMaisHtml =
        restante > 0
          ? `<button type="button" id="btn-mostrar-mais" class="btn-suave" style="grid-column:1/-1;">Mostrar mais (${restante} restantes)</button>`
          : "";

      elListaPalavras.innerHTML = botoesHtml + botaoMaisHtml;
    }

    function renderizarMinhasPalavras() {
      const salvas = LISTA_PALAVRAS.filter((p) => estado.minhasPalavras.has(p.id));
      if (elContadorSalvas) {
        elContadorSalvas.textContent = String(salvas.length);
      }

      if (salvas.length === 0) {
        elListaMinhas.innerHTML = `
          <div class="estado-vazio" style="grid-column:1/-1;">
            <p style="margin:0 0 6px;font-weight:700;color:var(--cor-texto);">Nenhuma palavra salva ainda</p>
            <p style="margin:0;">Abra uma palavra no Dicionário e toque em <strong>Salvar</strong> para montar sua lista.</p>
          </div>
        `;
        return;
      }

      elListaMinhas.innerHTML = salvas
        .map((item) => criarHtmlItemPalavra(item, false, item.tema, false))
        .join("");
    }

    function selecionarPalavra(id, irParaDicionario = false) {
      if (!obterPalavraPorId(id)) return;
      estado.palavraSelecionadaId = id;
      if (irParaDicionario) {
        trocarAba("dicionario");
      }
      renderizarCardDetalhe();
      renderizarListaPalavras();
      fecharSugestoes();
      elCardDetalhe.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function alternarSalvarPalavra(id) {
      const online =
        estado.palavraOnlineAtual && estado.palavraOnlineAtual.id === id
          ? estado.palavraOnlineAtual
          : null;

      if (estado.minhasPalavras.has(id)) {
        estado.minhasPalavras.delete(id);
      } else {
        if (online && !LISTA_PALAVRAS.some((p) => p.id === id)) {
          LISTA_PALAVRAS.push(online);
          const extras = LISTA_PALAVRAS.filter((p) => p.online);
          salvarStorage(STORAGE_PALAVRAS_EXTRAS, extras);
          popularSeletoresTema();
          renderizarBarraProgresso();
        }
        estado.minhasPalavras.add(id);
      }
      salvarStorage(STORAGE_SALVAS, Array.from(estado.minhasPalavras));
      renderizarCardDetalhe();
      renderizarListaPalavras();
      renderizarMinhasPalavras();
    }

    // =========================================================================
    // FLASHCARDS COM REPETIÇÃO ESPAÇADA SIMPLES
    // =========================================================================
    function obterPalavrasDevidas(tema = "todos") {
      const agora = Date.now();
      return LISTA_PALAVRAS.filter((item) => {
        if (tema !== "todos" && item.tema !== tema) return false;
        const registro = estado.srs[item.id];
        if (!registro) return true;
        return Number(registro.proximaRevisao || 0) <= agora;
      });
    }

    function iniciarSessaoFlashcards() {
      const modo = elFcModo.value;
      const tema = elFcTema.value;
      let base = [];

      if (modo === "devidas") {
        base = obterPalavrasDevidas(tema);
      } else if (modo === "minhas") {
        base = LISTA_PALAVRAS.filter(
          (p) => estado.minhasPalavras.has(p.id) && (tema === "todos" || p.tema === tema)
        );
      } else {
        base = LISTA_PALAVRAS.filter((p) => tema === "todos" || p.tema === tema);
      }

      const ordenadas = embaralharArray(base).sort((a, b) => {
        const na = estado.srs[a.id] ? estado.srs[a.id].nivel : 1;
        const nb = estado.srs[b.id] ? estado.srs[b.id].nivel : 1;
        return na - nb;
      });

      estado.fcFila = ordenadas.slice(0, 20);
      estado.fcVirado = false;
      estado.fcRespondidasSessao = 0;
      renderizarFlashcards();
    }

    function responderFlashcard(acertou) {
      if (estado.fcFila.length === 0) return;
      const atual = estado.fcFila.shift();
      const prev = estado.srs[atual.id] || { nivel: 0, acertos: 0, erros: 0 };

      if (acertou) {
        const novoNivel = Math.min(5, (prev.nivel || 0) + 1);
        const dias = INTERVALOS_SRS_DIAS[novoNivel];
        estado.srs[atual.id] = {
          nivel: novoNivel,
          proximaRevisao: Date.now() + dias * 24 * 60 * 60 * 1000,
          acertos: (prev.acertos || 0) + 1,
          erros: prev.erros || 0
        };
      } else {
        estado.srs[atual.id] = {
          nivel: 0,
          proximaRevisao: Date.now() + 60 * 1000,
          acertos: prev.acertos || 0,
          erros: (prev.erros || 0) + 1
        };
        const posicaoRetorno = Math.min(2, estado.fcFila.length);
        estado.fcFila.splice(posicaoRetorno, 0, atual);
      }

      salvarStorage(STORAGE_SRS, estado.srs);
      registrarEstudo(atual.id);
      estado.fcRespondidasSessao += 1;
      estado.fcVirado = false;
      renderizarFlashcards();
    }

    function renderizarFlashcards() {
      if (estado.fcFila.length === 0) {
        const modo = elFcModo.value;
        const msg =
          estado.fcRespondidasSessao > 0
            ? `Você concluiu ${estado.fcRespondidasSessao} revisões nesta sessão.`
            : modo === "minhas" && estado.minhasPalavras.size === 0
              ? "Salve algumas palavras no Dicionário primeiro ou escolha outro conjunto acima."
              : "Nenhuma palavra pendente neste filtro agora.";

        elFcConteudo.innerHTML = `
          <div class="estado-vazio">
            <p style="margin:0 0 8px;font-size:1.08rem;font-weight:800;color:var(--cor-texto);">
              ${estado.fcRespondidasSessao > 0 ? "Sessão concluída" : "Tudo em dia por aqui"}
            </p>
            <p style="margin:0 0 16px;">${escaparHtml(msg)}</p>
            <button type="button" id="btn-fc-estudar-todas" class="btn-primario">
              Estudar palavras deste tema
            </button>
          </div>
        `;

        document.getElementById("btn-fc-estudar-todas").addEventListener("click", () => {
          elFcModo.value = "todas";
          sincronizarSelectCustomizado(elFcModo);
          iniciarSessaoFlashcards();
        });
        return;
      }

      const item = estado.fcFila[0];
      const reg = estado.srs[item.id];
      const infoNivel = reg ? `Nível ${reg.nivel}/5` : "Nova";

      const blocoCognato = item.falsoCognato
        ? `<div class="alerta-falso-cognato" style="margin-top:12px;">${iconeSvg("alerta")}<div><strong>Falso cognato</strong><span>${escaparHtml(
            item.falsoCognato
          )}</span></div></div>`
        : "";

      const versoHtml = estado.fcVirado
        ? `
          <div class="flashcard-verso">
            <p class="secao-titulo">Traduções</p>
            <ol class="lista-traducoes" style="margin-bottom:10px;">
              ${item.traducoes.map((t) => `<li>${escaparHtml(t)}</li>`).join("")}
            </ol>
            ${
              item.plural
                ? `<p class="info-formas" style="margin-bottom:8px;"><strong>Plural:</strong> ${escaparHtml(item.plural)}</p>`
                : ""
            }
            ${
              item.formasIrregulares
                ? `<p class="info-formas" style="margin-bottom:8px;"><strong>Irregular:</strong> ${escaparHtml(
                    item.formasIrregulares.passado
                  )} / ${escaparHtml(item.formasIrregulares.participio)}</p>`
                : ""
            }
            ${blocoCognato}
            <div class="exemplo-item" style="border-top:1px solid var(--cor-borda);margin-top:10px;">
              <div class="exemplo-textos">
                <p class="exemplo-en">${escaparHtml(item.exemplos[0].en)}</p>
                <p class="exemplo-pt">${escaparHtml(item.exemplos[0].pt)}</p>
              </div>
            </div>
          </div>
        `
        : '<p class="flashcard-dica">Tente lembrar o significado e toque em <strong>Virar cartão</strong>.</p>';

      const botoesHtml = estado.fcVirado
        ? `
          <div class="flashcard-acoes">
            <button type="button" id="btn-fc-nao-sei" class="btn-nao-sei">
              ${iconeSvg("errado")}
              <span>Não sei</span>
            </button>
            <button type="button" id="btn-fc-sei" class="btn-sei">
              ${iconeSvg("certo")}
              <span>Sei</span>
            </button>
          </div>
        `
        : `
          <button type="button" id="btn-fc-virar" class="btn-primario btn-largura-total">
            ${iconeSvg("olho")}
            <span>Virar cartão</span>
          </button>
        `;

      elFcConteudo.innerHTML = `
        <div class="flashcard-area">
          <div class="flashcard-topo">
            <span>Restantes: <strong>${estado.fcFila.length}</strong></span>
            <span>${escaparHtml(item.tema)} · ${escaparHtml(infoNivel)}</span>
          </div>

          <div class="flashcard-frente">
            <p class="flashcard-palavra">${escaparHtml(item.palavra)}</p>
            <p class="meta-inline" style="margin:0 0 10px;">${escaparHtml(item.classe)}</p>
            <div style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
              <span class="linha-pronuncia" style="margin:0;">Como ler: ${escaparHtml(item.pronuncia || item.ipa)}</span>
              <button type="button" id="btn-fc-ouvir" class="btn-icone btn-suave" aria-label="Ouvir pronúncia">
                ${iconeSvg("volume")}
              </button>
            </div>
            ${versoHtml}
          </div>
        </div>
        ${botoesHtml}
      `;

      document.getElementById("btn-fc-ouvir").addEventListener("click", () => {
        falarTexto(item.palavra, null);
      });

      if (estado.fcVirado) {
        document.getElementById("btn-fc-nao-sei").addEventListener("click", () => {
          responderFlashcard(false);
        });
        document.getElementById("btn-fc-sei").addEventListener("click", () => {
          responderFlashcard(true);
        });
      } else {
        document.getElementById("btn-fc-virar").addEventListener("click", () => {
          estado.fcVirado = true;
          renderizarFlashcards();
        });
      }
    }

    // =========================================================================
    // QUIZ DE MÚLTIPLA ESCOLHA (EN→PT e PT→EN)
    // =========================================================================
    function iniciarQuiz() {
      const fonte = elQuizFonte.value;
      const sentidoSelecionado = elQuizSentido.value;

      let pool = [];
      if (fonte === "minhas") {
        pool = LISTA_PALAVRAS.filter((p) => estado.minhasPalavras.has(p.id));
      } else if (fonte === "todas") {
        pool = LISTA_PALAVRAS.slice();
      } else {
        pool = LISTA_PALAVRAS.filter((p) => p.tema === fonte);
      }

      if (pool.length < 4) {
        elQuizConteudo.innerHTML = `
          <div class="estado-vazio">
            <p style="margin:0 0 6px;font-weight:700;color:var(--cor-texto);">Poucas palavras disponíveis</p>
            <p style="margin:0;">O quiz precisa de pelo menos <strong>4 palavras</strong> nesta seleção. Salve mais palavras ou escolha outro filtro.</p>
          </div>
        `;
        return;
      }

      const sorteadas = embaralharArray(pool).slice(0, 10);
      estado.quizPerguntas = sorteadas.map((item) => {
        const sentido =
          sentidoSelecionado === "misto"
            ? Math.random() < 0.5
              ? "en-pt"
              : "pt-en"
            : sentidoSelecionado;

        const respostaCerta =
          sentido === "en-pt" ? item.traducoes.join(", ") : item.palavra;

        const candidatos = embaralharArray(
          LISTA_PALAVRAS.filter((outro) => {
            if (outro.id === item.id) return false;
            const textoOutro =
              sentido === "en-pt" ? outro.traducoes.join(", ") : outro.palavra;
            return normalizarTexto(textoOutro) !== normalizarTexto(respostaCerta);
          })
        );

        const opcoesTexto = [respostaCerta];
        for (const cand of candidatos) {
          const txt = sentido === "en-pt" ? cand.traducoes.join(", ") : cand.palavra;
          if (!opcoesTexto.includes(txt)) {
            opcoesTexto.push(txt);
          }
          if (opcoesTexto.length === 4) break;
        }

        return {
          item,
          sentido,
          respostaCerta,
          opcoes: embaralharArray(opcoesTexto),
          escolhida: null
        };
      });

      estado.quizIndice = 0;
      estado.quizAcertos = 0;
      estado.quizErros = [];
      estado.quizRespondida = false;
      estado.quizEmAndamento = true;
      renderizarQuiz();
    }

    function responderQuiz(opcaoEscolhida) {
      if (estado.quizRespondida) return;
      const atual = estado.quizPerguntas[estado.quizIndice];
      atual.escolhida = opcaoEscolhida;
      estado.quizRespondida = true;

      const acertou = opcaoEscolhida === atual.respostaCerta;
      if (acertou) {
        estado.quizAcertos += 1;
      } else {
        estado.quizErros.push(atual.item);
      }

      registrarEstudo(atual.item.id);
      renderizarQuiz();
    }

    function renderizarQuiz() {
      if (!estado.quizEmAndamento) {
        elQuizConteudo.innerHTML = `
          <div class="estado-vazio">
            <p style="margin:0 0 6px;font-weight:700;color:var(--cor-texto);">Pronto para praticar?</p>
            <p style="margin:0;">Escolha o sentido e toque em <strong>Iniciar Quiz</strong> acima.</p>
          </div>
        `;
        return;
      }

      if (estado.quizIndice >= estado.quizPerguntas.length) {
        const total = estado.quizPerguntas.length;
        const pct = Math.round((estado.quizAcertos / total) * 100);
        const listaErrosHtml = estado.quizErros.length
          ? `
            <div class="secao-card" style="text-align:left;">
              <h3 class="secao-titulo">Para revisar (${estado.quizErros.length})</h3>
              <div class="grade-palavras">
                ${estado.quizErros
                  .map(
                    (it) => `
                  <button type="button" class="item-palavra-btn" data-abrir-erro="${escaparHtml(it.id)}">
                    <span class="item-esquerda">
                      <span class="item-titulo">${escaparHtml(it.palavra)}</span>
                      <span class="item-sub">${escaparHtml(it.traducoes.join(", "))}</span>
                    </span>
                    <span class="item-direita">Abrir</span>
                  </button>
                `
                  )
                  .join("")}
              </div>
            </div>
          `
          : '<p style="margin:10px 0 0;font-weight:700;color:var(--cor-salvo-texto);">Excelente! Você acertou todas.</p>';

        elQuizConteudo.innerHTML = `
          <div class="card-painel" style="text-align:center;">
            <h2 style="margin:0 0 6px;">Resultado do Quiz</h2>
            <p style="font-size:2rem;font-weight:800;margin:8px 0;color:var(--cor-primaria);">
              ${estado.quizAcertos} / ${total} (${pct}%)
            </p>
            ${listaErrosHtml}
            <button type="button" id="btn-novo-quiz" class="btn-primario btn-largura-total" style="margin-top:16px;">
              Jogar novamente
            </button>
          </div>
        `;

        document.getElementById("btn-novo-quiz").addEventListener("click", iniciarQuiz);
        elQuizConteudo.querySelectorAll("[data-abrir-erro]").forEach((btn) => {
          btn.addEventListener("click", () => {
            selecionarPalavra(btn.getAttribute("data-abrir-erro"), true);
          });
        });
        return;
      }

      const q = estado.quizPerguntas[estado.quizIndice];
      const eEnPt = q.sentido === "en-pt";
      const enunciado = eEnPt ? q.item.palavra : q.item.traducoes.join(", ");
      const rotuloSentido = eEnPt ? "Inglês → Português" : "Português → Inglês";

      let feedbackHtml = "";
      if (estado.quizRespondida) {
        const acertou = q.escolhida === q.respostaCerta;
        const avisoCognato = q.item.falsoCognato
          ? `<div class="alerta-falso-cognato" style="margin-top:10px;">${iconeSvg("alerta")}<div><strong>Falso cognato</strong><span>${escaparHtml(
              q.item.falsoCognato
            )}</span></div></div>`
          : "";

        feedbackHtml = `
          <div class="quiz-feedback ${acertou ? "acerto" : "erro"}" role="status">
            ${acertou ? iconeSvg("certo") : iconeSvg("errado")}
            <span>
              ${
                acertou
                  ? "Resposta correta!"
                  : `Resposta certa: ${escaparHtml(q.respostaCerta)}`
              }
            </span>
          </div>
          ${avisoCognato}
          <button type="button" id="btn-quiz-proxima" class="btn-primario btn-largura-total" style="margin-top:12px;">
            ${
              estado.quizIndice + 1 < estado.quizPerguntas.length
                ? "Próxima pergunta"
                : "Ver resultado final"
            }
          </button>
        `;
      }

      elQuizConteudo.innerHTML = `
        <div class="card-painel">
          <div class="flashcard-topo">
            <span>Pergunta <strong>${estado.quizIndice + 1}</strong> de ${estado.quizPerguntas.length}</span>
            <span>${escaparHtml(rotuloSentido)}</span>
          </div>

          <p class="secao-titulo" style="margin-bottom:4px;">
            ${eEnPt ? "Qual é a tradução em português?" : "Como se diz em inglês?"}
          </p>
          <p class="palavra-titulo" style="font-size:1.75rem;margin:4px 0 8px;">
            ${escaparHtml(enunciado)}
          </p>
          ${
            eEnPt
              ? `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;">
                   <span class="linha-pronuncia" style="margin:0;">Como ler: ${escaparHtml(q.item.pronuncia || q.item.ipa)}</span>
                   <button type="button" id="btn-quiz-ouvir" class="btn-suave">
                     ${iconeSvg("volume")}
                     <span>Ouvir</span>
                   </button>
                 </div>`
              : `<p class="meta-inline" style="margin:0 0 6px;">Classe: ${escaparHtml(q.item.classe)}</p>`
          }

          <div class="quiz-opcoes">
            ${q.opcoes
              .map((op) => {
                let classeExtra = "";
                if (estado.quizRespondida) {
                  if (op === q.respostaCerta) classeExtra = "correta";
                  else if (op === q.escolhida) classeExtra = "errada";
                }
                return `
                  <button
                    type="button"
                    class="quiz-opcao-btn ${classeExtra}"
                    data-opcao="${escaparHtml(op)}"
                    ${estado.quizRespondida ? "disabled" : ""}
                  >
                    ${escaparHtml(op)}
                  </button>
                `;
              })
              .join("")}
          </div>

          ${feedbackHtml}
        </div>
      `;

      const btnQuizOuvir = document.getElementById("btn-quiz-ouvir");
      if (btnQuizOuvir) {
        btnQuizOuvir.addEventListener("click", () => falarTexto(q.item.palavra, null));
      }

      elQuizConteudo.querySelectorAll("[data-opcao]").forEach((btn) => {
        btn.addEventListener("click", () => {
          responderQuiz(btn.getAttribute("data-opcao"));
        });
      });

      const btnProxima = document.getElementById("btn-quiz-proxima");
      if (btnProxima) {
        btnProxima.addEventListener("click", () => {
          estado.quizIndice += 1;
          estado.quizRespondida = false;
          renderizarQuiz();
        });
      }
    }

    function mostrarStatusJson(mensagem, ehErro = false) {
      elStatusJson.textContent = mensagem;
      elStatusJson.classList.toggle("erro", ehErro);
      elStatusJson.classList.remove("oculto");

    function exportarMinhasPalavrasJson() {
      const listaIds = Array.from(estado.minhasPalavras);
      if (listaIds.length === 0) {
        mostrarStatusJson("Você ainda não salvou nenhuma palavra para exportar.", true);
        return;
      }

      const payload = {
        app: "dicionario-en-pt",
        versao: 1,
        exportadoEm: new Date().toISOString(),
        minhasPalavras: listaIds
      };

      try {
        const blob = new Blob([JSON.stringify(payload, null, 2)], {
          type: "application/json"
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "minhas-palavras-en-pt.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        mostrarStatusJson(`${listaIds.length} palavras exportadas para JSON.`);
      } catch (erro) {
        mostrarStatusJson("Não foi possível gerar o arquivo JSON neste navegador.", true);
      }
    }

    function importarMinhasPalavrasJson(arquivo) {
      if (!arquivo) return;
      const leitor = new FileReader();
      leitor.onload = () => {
        try {
          const dados = JSON.parse(String(leitor.result || ""));
          const listaBruta = Array.isArray(dados)
            ? dados
            : dados && Array.isArray(dados.minhasPalavras)
              ? dados.minhasPalavras
              : null;

          if (!listaBruta) {
            mostrarStatusJson("Arquivo JSON inválido: campo 'minhasPalavras' não encontrado.", true);
            return;
          }

          const idsValidos = new Set(LISTA_PALAVRAS.map((p) => p.id));
          let adicionadas = 0;
          for (const id of listaBruta) {
            if (typeof id === "string" && idsValidos.has(id) && !estado.minhasPalavras.has(id)) {
              estado.minhasPalavras.add(id);
              adicionadas += 1;
            }
          }

          salvarStorage(STORAGE_SALVAS, Array.from(estado.minhasPalavras));
          renderizarCardDetalhe();
          renderizarListaPalavras();
          renderizarMinhasPalavras();
          mostrarStatusJson(
            adicionadas > 0
              ? `${adicionadas} nova(s) palavra(s) importada(s). Total salvo: ${estado.minhasPalavras.size}.`
              : `Importação concluída. Todas as palavras válidas já estavam salvas (${estado.minhasPalavras.size}).`
          );
        } catch (erro) {
          mostrarStatusJson("Não foi possível ler o arquivo JSON. Verifique o formato.", true);
        } finally {
          elInputImportarJson.value = "";
        }
      };
      leitor.onerror = () => {
        mostrarStatusJson("Erro ao tentar abrir o arquivo selecionado.", true);
      };
      leitor.readAsText(arquivo);
    }

        { nome: "dicionario", btn: elAbaDicionario, painel: elPainelDicionario },

        { nome: "quiz", btn: elAbaQuiz, painel: elPainelQuiz },

      ];

      for (const item of abas) {

        item.btn.classList.toggle("ativa", ativa);
        item.btn.setAttribute("aria-pressed", String(ativa));
        item.painel.classList.toggle("oculto", !ativa);
      }

      if (nomeAba === "flashcards" && estado.fcFila.length === 0 && estado.fcRespondidasSessao === 0) {
        iniciarSessaoFlashcards();

    }

        evento.preventDefault();
        estado.indiceSugestaoAtiva = (estado.indiceSugestaoAtiva + 1) % botoes.length;
        renderizarSugestoes();
      } else if (evento.key === "ArrowUp" && botoes.length > 0) {
        evento.preventDefault();
        estado.indiceSugestaoAtiva =
          (estado.indiceSugestaoAtiva - 1 + botoes.length) % botoes.length;
        renderizarSugestoes();
      } else if (evento.key === "Enter") {
        if (botoes.length > 0) {
          evento.preventDefault();
          const alvo =
            estado.indiceSugestaoAtiva >= 0 ? botoes[estado.indiceSugestaoAtiva] : botoes[0];
          const id = alvo.getAttribute("data-id");
          const termoOnline = alvo.getAttribute("data-online-termo");

            buscarPalavraOnline(termoOnline);

          evento.preventDefault();
          buscarPalavraOnline(estado.termoBusca.trim());

        fecharSugestoes();

    // =========================================================================
    // TRADUTOR RÁPIDO INLINE
    // =========================================================================
    (function inicializarTradutor() {
      const elEntrada = document.getElementById("tradutor-entrada");
      const elResultado = document.getElementById("tradutor-resultado");
      const elAcoes = document.getElementById("tradutor-acoes");
      const elAlternativas = document.getElementById("tradutor-alternativas");
      const elBtnTrocar = document.getElementById("btn-tradutor-trocar");
      const elBtnOuvirOriginal = document.getElementById("btn-tradutor-ouvir-original");
      const elBtnOuvirTraducao = document.getElementById("btn-tradutor-ouvir");
      const elLabelOrigem = document.getElementById("tradutor-label-origem");
      const elLabelDestino = document.getElementById("tradutor-label-destino");
      const elLabelResultado = document.getElementById("tradutor-label-resultado");

      if (!elEntrada || !elResultado) return;

      let direcao = "pt-en"; // pt→en ou en→pt
      let textoTraduzido = "";
      let textoOriginal = "";
      let timerDebounce = null;
      let requisicaoAtual = 0;

      function idiomaOrigem() { return direcao === "pt-en" ? "pt" : "en"; }
      function idiomaDestino() { return direcao === "pt-en" ? "en" : "pt"; }

      function atualizarLabels() {
        const nomeOrigem = direcao === "pt-en" ? "Português" : "Inglês";
        const nomeDestino = direcao === "pt-en" ? "Inglês" : "Português";
        if (elLabelOrigem) elLabelOrigem.textContent = nomeOrigem;
        if (elLabelDestino) elLabelDestino.textContent = nomeDestino;
        if (elLabelResultado) elLabelResultado.textContent = nomeDestino;
        elEntrada.placeholder = `Digite em ${nomeOrigem.toLowerCase()}...`;
      }

      function renderizarAlternativas(lista) {
        if (!elAlternativas) return;
        if (!lista || lista.length === 0) {
          elAlternativas.innerHTML = "";
          elAlternativas.style.display = "none";
          return;
        }
        elAlternativas.innerHTML =
          `<span class="tradutor-alt-label">Outras formas:</span>` +
          lista
            .slice(0, 4)
            .map(
              (alt) => `
                <button type="button" class="tradutor-chip" data-tradutor-alt="${escaparHtml(alt)}" title="Ouvir ${escaparHtml(alt)}">
                  ${iconeSvg("volume")}
                  <span>${escaparHtml(alt)}</span>
                </button>
              `
            )
            .join("");
        elAlternativas.style.display = "flex";
      }

      async function traduzir(texto) {
        textoOriginal = texto;
        const limpo = texto.trim();
        const idReq = ++requisicaoAtual;
        if (!limpo) {
          elResultado.textContent = "Tradução aparece aqui...";
          elResultado.classList.add("placeholder");
          elAcoes.style.display = "none";
          renderizarAlternativas([]);
          textoTraduzido = "";
          return;
        }
        elResultado.textContent = "Traduzindo...";
        elResultado.classList.add("placeholder");
        renderizarAlternativas([]);
        try {
          const sl = idiomaOrigem();
          const tl = idiomaDestino();
          const res = await consultarTraducaoApi({ sl, tl, q: limpo });
          if (idReq !== requisicaoAtual) return;

          textoTraduzido = res.texto || limpo;
          elResultado.textContent = textoTraduzido;
          elResultado.classList.remove("placeholder");
          elAcoes.style.display = "flex";
          renderizarAlternativas(res.alternativas);
        } catch (e) {
          if (idReq !== requisicaoAtual) return;
          elResultado.textContent = "Erro ao traduzir. Verifique sua conexão.";
          elResultado.classList.add("placeholder");
          textoTraduzido = "";
          elAcoes.style.display = "none";
          renderizarAlternativas([]);
        }
      }

      elEntrada.addEventListener("input", function () {
        clearTimeout(timerDebounce);
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 140) + "px";
        if (elBtnOuvirOriginal) {
          elBtnOuvirOriginal.style.display = this.value.trim() ? "inline-flex" : "none";
        }
        timerDebounce = setTimeout(() => traduzir(this.value), 480);
      });

      if (elBtnTrocar) {
        elBtnTrocar.addEventListener("click", function () {
          direcao = direcao === "pt-en" ? "en-pt" : "pt-en";
          atualizarLabels();
          if (textoTraduzido) {
            elEntrada.value = textoTraduzido;
            elEntrada.style.height = "auto";
            elEntrada.style.height = Math.min(elEntrada.scrollHeight, 140) + "px";
            if (elBtnOuvirOriginal) elBtnOuvirOriginal.style.display = "inline-flex";
            traduzir(textoTraduzido);
          } else if (elEntrada.value.trim()) {
            traduzir(elEntrada.value);
          }
        });
      }

      if (elAlternativas) {
        elAlternativas.addEventListener("click", function (evento) {
          const btn = evento.target.closest("[data-tradutor-alt]");
          if (!btn) return;
          const textoAlt = btn.getAttribute("data-tradutor-alt");
          if (textoAlt) falarTexto(textoAlt, null, idiomaDestino());
        });
      }

      if (elBtnOuvirOriginal) {
        elBtnOuvirOriginal.addEventListener("click", function () {
          falarTexto(textoOriginal || elEntrada.value, null, idiomaOrigem());
        });
      }

      if (elBtnOuvirTraducao) {
        elBtnOuvirTraducao.addEventListener("click", function () {
          falarTexto(textoTraduzido, null, idiomaDestino());
        });
      }

      atualizarLabels();
    })();

    // Inicialização
    popularSeletoresTema();
    inicializarSelectsCustomizados();
    aplicarTema(lerStorage(STORAGE_TEMA, null));
    atualizarStatusOffline();
    renderizarBarraProgresso();
    renderizarPalavraDoDia();
    renderizarCardDetalhe();
    renderizarListaPalavras();
    renderizarMinhasPalavras();
  </script>
</body>
</html>
